<script>/* 계속 쓰기판 : 서버 대신 서비스워커가 장부를 돌린다. 처음 한 번은 서비스워커가 붙을 때까지 기다렸다 다시 연다 */
(function(){
  if (!('serviceWorker' in navigator)) { document.write('<p style="font:18px sans-serif;padding:32px;line-height:1.6">이 브라우저에서는 계속 쓰기판을 열 수 없어요.<br>크롬이나 사파리로 열어 주세요.</p><plaintext style="display:none">'); return; }
  if (navigator.serviceWorker.controller) return;
  document.write('<div style="font:18px sans-serif;padding:48px 24px;text-align:center;line-height:1.7">계속 쓰기판을 준비하고 있어요…<br><small style="color:#888">처음 한 번만 몇 초 걸려요</small></div><plaintext style="display:none">');
  var 다시 = function(){ location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', 다시);
  navigator.serviceWorker.register('/sw.js').then(function(){ return navigator.serviceWorker.ready; }).then(function(){ setTimeout(function(){ if (navigator.serviceWorker.controller) 다시(); }, 400); });
})();
</script>

<script>
/* 🔴 **아이폰에서는 어떤 입력칸을 눌러도 화면이 확대되지 않게** 한 번 더 막는다 (사장님 2026-09-15 : 「어떤 입력에서도 화면이 확대되면 안돼 전수조사해줘」).
   1차 방어는 글씨 크기다(화면에서 16px 이상 · tools/확대검사.mjs 로 전 칸을 잰다). 이건 앞으로 새 칸이 작게 들어와도 새지 않게 하는 2차 방어다.
   ⛔ **아이폰·아이패드에만** 건다. 아이폰 사파리는 iOS 10 부터 maximum-scale 이 있어도 **손가락으로 벌려 키우는 것은 막지 않는다**(손님 확대는 그대로) —
      막히는 것은 입력칸에 손이 닿을 때 저절로 되는 확대뿐이다. 안드로이드 크롬은 이 값으로 손 확대까지 막히므로 **안 건다**(원래 입력칸 확대도 없다). */
(function () {
  var ua = navigator.userAgent || "";
  var 애플 = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!애플) return;
  var m = document.querySelector("meta[name=viewport]");
  if (m) m.setAttribute("content", "width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover");
})();
</script>

/* --navgap  : 떠 있는 막대와 화면 바닥 사이

.u2span{font-style:normal;font-weight:600;font-size:15px;color:var(--faint);margin-left:6px;}
/* 카드 줄에서는 기간을 **제 줄로** 뗀다 (사장님 2026-09-13 : 「개행해줘」). 이름 옆에 붙여 두면
   폭이 모자라 「21 / 건」으로 쪼개졌다. ⛔ 기간·건수는 한 덩어리라 안 쪼갠다. */
.u2cardrow-l .u2span{display:block;margin:2px 0 0;white-space:nowrap;}

/* ── 다음 달에 나갈 것 ─────────────────────────────────── */
.u2lock{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:2px dashed color-mix(in srgb,var(--ink) 26%,var(--paper));border-radius:var(--r-box);
  padding:14px 16px;margin-bottom:14px;background:var(--paper);}
/* ⛔ **비치지 않게** 칠한다 (사장님 2026-09-23 : 「투명효과 넣지말기 배경에 묻혀」). 바탕 무늬가 비쳐 글이 묻혔다. */
.u2lock-t{font-weight:700;font-size:16px;min-width:0;}
.u2lock-t small{display:block;color:var(--sub);font-weight:400;font-size:16px;margin-top:2px;}
.u2lock-v{font-size:21px;flex:0 0 auto;}
/* 다음 달에 준비해 둬야 하는 돈 — **다른 칸과 같은 크기로** 세운다 (2026-09-12).
   ⛔ 점선은 남긴다. 「아직 안 나간, 임자 있는 돈」이라는 뜻이 그 선에 있다. */
.u2lock-big{display:block;padding:18px;margin-bottom:14px;}
.u2lock-h{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.u2lock-s{display:block;color:var(--sub);font-size:16px;font-weight:600;line-height:1.4;}
/* ⛔ 금액은 **한 줄로 못 박는다.** 접히면 숫자가 아니게 된다. */
.u2lock-big .u2lock-v{font-size:34px;line-height:1.15;margin:4px 0 7px;white-space:nowrap;}
.u2lock-m{color:var(--sub);font-size:16px;line-height:1.5;}
.u2lock-m b{color:var(--ink);font-weight:800;}
.u2lock-in{margin-top:8px;color:var(--ink);font-size:15px;font-weight:600;line-height:1.45;}
.u2fill-r{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);}
.u2fill-r > .u2emo{font-size:22px;line-height:1.2;flex:0 0 auto;}
.u2fill-r b{font-size:17px;font-weight:800;}
.u2fill-r small{display:block;color:var(--sub);font-size:15px;line-height:1.45;margin-top:2px;}

/* 갚고 있는 것 — 대출·할부 (2026-09-12) */
.u2debt{padding:16px 18px 8px;}
.u2debt-top{display:flex;align-items:center;gap:10px;padding-bottom:12px;
  border-bottom:1px solid var(--line);margin-bottom:4px;}
.u2debt-top b{font-size:17px;font-weight:800;}
.u2debt-top small{display:block;color:var(--sub);font-size:16px;margin-top:3px;}
.u2debt-top .u2big{margin-left:auto;font-size:26px;color:var(--out);white-space:nowrap;}
.u2debt-r{padding:13px 0;border-bottom:1px solid var(--line);-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;}
.u2debt-r.u2hold{transform:scale(.975);opacity:.72;transition:transform .16s ease,opacity .16s ease;}
.u2debt-r:last-of-type{border-bottom:0;}
.u2debt-h{display:flex;align-items:baseline;gap:10px;}
.u2debt-h b{font-size:17px;font-weight:700;min-width:0;}
.u2debt-h span{margin-left:auto;font-family:var(--ff),var(--ffui);font-weight:800;font-size:19px;
  white-space:nowrap;}
.u2debt-m{color:var(--faint);font-size:15px;margin-top:3px;line-height:1.45;}
/* ⛔ 막대는 **지나온 만큼**을 채운다. 남은 것을 채우면 갚을수록 막대가 자라 거꾸로 읽힌다. */
.u2debt-wrap{display:flex;align-items:center;gap:7px;margin-top:10px;}
.u2debt-bar{flex:1;min-width:0;height:9px;border-radius:99px;overflow:hidden;
  background:color-mix(in srgb,var(--ink) 10%,transparent);}
.u2debt-bar i{display:block;height:100%;border-radius:99px;background:var(--ink);}
.u2debt-s{color:var(--sub);font-size:15px;margin-top:6px;}
.u2debt-s b{color:var(--ink);font-weight:800;}
/* 갚고 있는 것 고도화 (2026-09-14) — 한눈에 · 숨통 · 대출 줄 */
.u2dx-sum{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
.u2dx-sum .u2big{font-size:30px;color:var(--out);white-space:nowrap;line-height:1;}
.u2dx-k{display:block;color:var(--faint);font-size:13.5px;line-height:1.45;}
.u2dx-stack{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:14px 0 8px;
  background:color-mix(in srgb,var(--ink) 7%,transparent);}
.u2dx-stack i{display:block;height:100%;}
.u2dx-leg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13.5px;color:var(--sub);font-weight:700;}
.u2dx-leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;}
.u2dx-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;}
.u2dx-three > div{background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:14px;padding:10px 10px 9px;min-width:0;}
.u2dx-three s{display:block;text-decoration:none;font-size:12.5px;color:var(--sub);font-weight:700;}
.u2dx-three b{display:block;font-family:var(--ff),var(--ffui);font-size:17px;margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.u2dx-warn{margin-top:12px;background:color-mix(in srgb,var(--pop) 12%,var(--paper));color:var(--ink);
  border-radius:14px;padding:11px 12px;font-size:14.5px;line-height:1.5;font-weight:700;}
.u2dx-steps{height:118px;justify-content:flex-start;}
/* ⛔ 끝나는 달이 한둘뿐이면 막대가 칸을 통째로 먹어 뭉툭한 벽이 된다 — 폭을 묶는다 */
.u2dx-steps .u2bar{flex:0 1 48px;}
.u2dx-steps .u2bar-now .u2bar-c{background:var(--ink);}
.u2dx-steps .u2bar-now .u2bar-v,.u2dx-steps .u2bar-now .u2bar-m{color:var(--ink);}
.u2dx-tl{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start;}
.u2dx-tld{flex:0 0 52px;font-weight:800;font-size:15px;}
.u2dx-tlt{flex:1;min-width:0;font-size:15px;line-height:1.45;}
.u2dx-tlt small{display:block;color:var(--sub);font-size:13.5px;}
.u2dx-tla{flex:0 0 auto;font-family:var(--ff),var(--ffui);font-weight:800;font-size:16px;white-space:nowrap;color:var(--in,#2f7a5a);}
.u2dx-hot .u2dx-tla,.u2dx-hot .u2dx-tlt small{color:var(--pop);}
.u2dx-dd{font-style:normal;font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;
  background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--sub);}
.u2dx-ddhot{background:var(--pop);color:var(--paper);}
/* 빌린 돈 · 연 이율 · 만기 세 칸 — 갚는 방식을 빼서 한 줄 셋, 이름 위 값 아래 (2026-09-15) */
.u2dx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;margin-top:10px;font-size:14.5px;}
.u2dx-grid > div{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;}
.u2dx-grid s{text-decoration:none;color:var(--sub);white-space:nowrap;}
.u2dx-grid b{font-weight:800;overflow-wrap:anywhere;}   /* ⛔ 세 칸이라 좁다 — 「100,000,000」이 옆 칸으로 안 넘치게 (교차검증 v166) */
.u2dx-grid em{font-style:normal;color:var(--pop);font-weight:700;white-space:nowrap;}

/* ── 십일조 ───────────────────────────────────────────── */
.u2tithe-v{font-family:var(--ff),var(--ffui);font-weight:800;font-size:30px;margin:6px 0 2px;}
.u2tithe-btns{display:flex;gap:9px;margin-top:12px;}
.u2tithe-btns button{flex:1;border-radius:var(--r-box);padding:13px;font-weight:800;font-size:16px;}
.u2tithe-btns .ghost{border:2px solid var(--line2);background:var(--paper);color:var(--sub);flex:0 0 92px;}
.u2tithe-btns .go{background:var(--ink);color:var(--bg);}
.u2tithe-btns .go:disabled{opacity:.4;}

/* ── 카드 / 은행 두 칸 ────────────────────────────────── */
.u2two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.u2two > div{border-radius:var(--r-card);box-shadow:var(--sh);padding:16px;min-width:0;}
.u2side-card{background:var(--paper);}
.u2side-bank{background:var(--ink);color:var(--bg);}
.u2two-k{font-size:15px;opacity:.62;line-height:1.35;}
.u2two-v{font-size:25px;margin-top:4px;}
.u2two-m{font-size:15px;margin-top:8px;display:inline-block;border-radius:99px;padding:3px 10px;}
.u2side-card .u2two-m{background:color-mix(in srgb,var(--acc2) 40%,var(--paper));color:var(--pop);}
.u2side-bank .u2two-m{background:var(--acc);color:var(--ink);font-weight:800;}

.u2cardrow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;
  padding:13px 2px;border-bottom:1px solid var(--line);}
.u2cardrow:last-of-type{border-bottom:0;}
.u2cardrow-l b{display:block;font-size:17px;font-weight:700;}
.u2cardrow-l small{display:block;color:var(--faint);font-size:16px;margin-top:2px;}
.u2cardrow-r{display:flex;align-items:center;gap:9px;justify-self:end;}
.u2cardrow-r b{font-family:var(--ff),var(--ffui);font-weight:800;font-size:19px;}
.u2open{grid-column:1/-1;}
.u2cd2{display:flex;gap:8px;}
.u2cd2 .u2more{margin-top:6px;}
.u2mini{border:2px solid var(--line2);border-radius:99px;padding:6px 12px;
  font-size:16px;font-weight:800;color:var(--sub);background:var(--paper);}
/* 며칠에 — 칩 옆 직접 넣는 칸 (칩과 같은 높이라야 줄이 안 어긋난다) */
.u2dayin{width:58px;border:2px solid var(--line2);border-radius:99px;padding:7px 10px;
  font-size:16px;font-weight:700;text-align:center;outline:none;}
.u2dayin:focus{border-color:var(--ink);}
/* 카드 한 줄 */
.u2cd{border-bottom:1px solid var(--line);padding:12px 0;}
.u2cd:last-of-type{border-bottom:0;}
.u2cd-n{width:100%;border:2px solid var(--line2);border-radius:var(--r-box);padding:11px 13px;
  font-size:17px;font-weight:700;outline:none;}
.u2cd-n:focus{border-color:var(--ink);}
.u2cd-r{display:flex;align-items:center;gap:7px;margin-top:8px;color:var(--sub);font-size:16px;}
.u2cd-r input{width:54px;border:2px solid var(--line2);border-radius:99px;padding:6px 8px;
  font-size:15px;font-weight:700;text-align:center;outline:none;}
.u2cd-x{margin-left:auto;width:30px;height:30px;border-radius:99px;color:var(--faint);}
.u2cd-kind{margin:0 0 8px;}
.u2cd-note{color:var(--sub);font-size:15px;line-height:1.4;}
/* ⛔ 처음 설정의 **금액 칸은 남는 폭을 다 쓴다** (사장님 2026-09-15 : 「좁아 금액적기에 우측으로 길이 늘려」).
   54px 알약에 588 만 쳐도 꽉 찼다. 날짜 칸(두 자리)은 그대로 둔다. */
.u2cd-r input[data-ff="amt"]{flex:1 1 auto;width:auto;min-width:0;}
/* 카드마다 「이 카드로 낸 것」 — 결제수단 이름이 안 맞으면 카드값이 조용히 0원이 된다 */
.u2cd-p{margin-top:10px;}
.u2cd-p > label{display:block;color:var(--sub);font-size:16px;margin-bottom:6px;}
.u2cd-p .chips{margin:0;}
.u2cd-p .chip.u2taken{opacity:.42;}
.u2joinrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.u2join{flex:1 1 auto;min-height:46px;border-radius:var(--r-box);background:var(--ink);color:var(--bg);
  font-weight:800;font-size:17px;padding:12px 16px;}
.u2join:disabled{opacity:.5;}
.u2cd-r input.u2bad{border-color:var(--pop);background:color-mix(in srgb,var(--pop) 12%,var(--paper));}
.u2cd-err{background:color-mix(in srgb,var(--pop) 14%,var(--paper));border:2px solid var(--pop);
  border-radius:var(--r-box);padding:12px 14px;margin:12px 0 4px;font-size:16px;line-height:1.5;
  font-weight:700;color:var(--ink);}
.u2cd-warn{background:color-mix(in srgb,var(--acc2) 26%,var(--paper));border-radius:var(--r-box);
  padding:13px 15px;font-size:16px;line-height:1.55;margin-bottom:12px;}
.u2fld input:disabled{background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--sub);}

/* ── 목록 ─────────────────────────────────────────────── */
.u2r{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);
  -webkit-touch-callout:none;}
/* 꾹 누르는 동안 — **누르고 있다는 것이 손에 보여야** 500ms 를 기다릴 수 있다.
   ⛔ 색을 바꾸지 않고 살짝 눌러만 준다. 목록에서 빨갛게 물들면 지운 줄로 보인다. */
.u2r.u2hold{transform:scale(.975);opacity:.72;transition:transform .16s ease,opacity .16s ease;}
/* 옆으로 밀어 지우기 — 줄 뒤에 빨간 「지우기」가 숨어 있다
   ⛔ .u2sw 라 부르지 말 것 — 켜고 끄는 스위치가 이미 그 이름이다(동그란 알약으로 찌그러졌다). */
.u2swipe{position:relative;overflow:hidden;}
.u2swipe-del{position:absolute;top:0;right:0;bottom:1px;width:88px;border:0;background:var(--out);
  color:#fff;font-weight:800;font-size:16px;}
.u2swipe > .u2r{position:relative;background:var(--paper);transition:transform .18s ease;touch-action:pan-y;
  -webkit-user-select:none;user-select:none;}
/* ⛔ 감싼 칸 안에서는 줄이 늘 「마지막 div」라 .u2r:last-of-type 이 **모든 줄의 밑줄**을 지웠다(교차검증 2026-09-14).
   ⛔ .u2r 을 두 번 적어 무게를 올린다 — 같은 무게면 아래쪽 .u2r:last-of-type 이 이긴다(실제로 졌다). */
.u2swipe > .u2r.u2r{border-bottom:1px solid var(--line);}
.u2swipe:last-of-type > .u2r.u2r{border-bottom:0;}
.u2r:last-of-type{border-bottom:0;}
.u2r.tap{cursor:pointer;}
.u2r-day{flex:0 0 46px;color:var(--faint);font-size:16px;}
.u2r-nm{flex:1;min-width:0;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.u2r-am{flex:0 0 auto;font-family:var(--ff),var(--ffui);font-weight:800;font-size:18px;}
.u2more{display:block;width:100%;text-align:center;padding:13px;margin-top:6px;border-radius:var(--r-box);
  background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--sub);font-size:16px;}

/* 체크할 것 */
.u2chk-r{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);}
.u2chk-r:last-of-type{border-bottom:0;}
.u2chk-b{width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:2px solid var(--line2);
  display:grid;place-items:center;color:transparent;}
.u2chk-b svg{width:16px;height:16px;}
.u2chk-r.done .u2chk-b{background:var(--in);border-color:var(--in);color:var(--paper);}
.u2chk-t{flex:1;min-width:0;font-size:16px;font-weight:600;}
.u2chk-r.done .u2chk-t{color:var(--faint);text-decoration:line-through;}
.u2chk-x{flex:0 0 auto;width:28px;height:28px;border-radius:99px;color:var(--faint);font-size:15px;}
.u2chk-add{display:flex;gap:8px;margin-top:10px;}
/* 🔴 **폰이 화면을 통째로 확대하는 것을 막는다** (사장님 2026-09-11 :
   「텍스트를 쓰면 창이 확대되어서 오른쪽이 잘려보임」).
   아이폰 사파리는 글씨가 16px 보다 **작은** 칸에 손이 닿으면 화면을 확대해 버린다.
   ⛔ 우리는 문서 뿌리에 zoom:0.9 를 걸어 두었다(크기입히기). 그래서 16px 이라고 적어도
      화면에서는 14.4px 이라 확대가 걸렸다. **0.9 로 나눈 18px** 을 적어야 진짜 16px 이 된다.
   ⛔ 글씨를 키우는 쪽이 1차 방어다. maximum-scale=1 은 **아이폰에만** 2차 방어로 건다(문서 머리 참고) —
      아이폰은 그래도 손 확대가 되고, 안드로이드는 손 확대까지 막히므로 거기엔 안 건다. */
.u2chk-add input{flex:1;min-width:0;background:var(--paper);border:2px solid var(--line2);
  border-radius:var(--r-box);padding:12px 14px;font-size:18px;outline:none;}
.u2chk-add input:focus{border-color:var(--ink);}
.u2chk-add button{flex:0 0 52px;border-radius:var(--r-box);background:var(--ink);color:var(--bg);
  font-size:22px;font-weight:800;}
/* 휴지통 — 지운 메모가 스무 개까지 남는다 */
.u2trash{position:relative;width:32px;height:32px;border-radius:99px;display:grid;place-items:center;
  color:var(--faint);background:color-mix(in srgb,var(--ink) 5%,transparent);flex:0 0 32px;}
.u2trash svg{width:17px;height:17px;}
.u2trash i{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:99px;
  background:var(--pop);color:var(--paper);font-size:12px;font-weight:800;font-style:normal;
  display:grid;place-items:center;padding:0 4px;}
.u2tr-r{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);}
.u2tr-r:last-of-type{border-bottom:0;}
.u2tr-r span{flex:1;min-width:0;font-size:16px;}
.u2tr-r button{flex:0 0 auto;border:2px solid var(--line2);border-radius:99px;padding:7px 13px;
  font-size:16px;font-weight:800;color:var(--sub);background:var(--paper);}
.u2praise{text-align:center;padding:24px 10px 8px;}
.u2praise-a{font-family:'lb-ahyoung',var(--ff);font-size:23px;letter-spacing:.5px;}
.u2praise-b{color:var(--sub);font-size:15px;margin-top:6px;}

/* ── 도장판 ─────────────────────────────────────────────
   ⛔ 도장은 **크게 박힌다** (사장님 2026-09-08 : 「화면에서 크게 박히는 느낌 · 파티클도 터지고」).
      달력 칸 안에서 조그맣게 찍으면 「참은 하루」의 값어치가 안 산다. */
.u2stamp-top{text-align:center;padding:4px 0 18px;}
.u2stamp-top h2{font-family:'lb-ahyoung',var(--ff);font-size:29px;line-height:1.25;letter-spacing:.5px;}
.u2stamp-cnt{display:inline-block;margin-top:10px;background:var(--acc);color:var(--ink);
  border-radius:99px;padding:8px 18px;font-weight:800;font-size:17px;}

/* 한 줄을 이름과 금액으로 가른다 — 마지막 숫자가 금액이다.
   ⛔ 역슬래시를 안 쓴다. 숫자는 [0-9] 로 적는다(이 자리에서 두 번 새어 파서가 죽었다). */
function 읽기(raw) {
  const t = String(raw || '').trim();
  const ms = [...t.matchAll(/[0-9][0-9,]*/g)];
  if (!ms.length) return null;
  const last = ms[ms.length - 1];
  const amt = Number(last[0].replace(/,/g, '')) || 0;
  if (!amt) return null;
  const name = (t.slice(0, last.index) + t.slice(last.index + last[0].length))
    .replace(/원[ ]*$/, '').replace(/[ ]+/g, ' ').trim();
  return { name, amt };
}

/* ⛔ 날짜 칸(input[type=date] · [type=month])은 폰이 **제 나름의 너비**를 갖고 있어서
   width:100% 로도 상자를 삐져나간다 (사장님 지적 2026-09-09 : 「입력폼카드 넘친다」).
   그 삐져나간 만큼 창이 옆으로 스크롤되면서, 알약을 누를 때 **화면이 좌우로 흔들렸다**
   (같은 날 : 「구분 알약을 선택할때 화면이 좌우로 움직여버려」). 둘은 같은 사고다.
   🔴 앞서 date 만 막았다가 **month 를 빠뜨려** 고정지출 창이 123px 삐져나갔다
      (전수조사 2026-09-09 에 잡음). 종류를 하나씩 세지 말고 **모든 칸**에 못 박는다.
   ⛔ 나란히 놓인 칸(언제부터~언제까지)은 min-width:0 이 없으면 flex 가 안 줄여 준다. */
.u2fld input{min-width:0;max-width:100%;}
/* ⛔ **칸 높이를 하나로** (사장님 2026-09-15 : 「입력폼 높이가 다른것보다 좁아서 통일시켜」).
   달 칸(type=month)은 appearance:none 을 걸고 나면 비어 있을 때 글줄 높이를 잃어 이름·비고 칸보다 낮게 섰다. */
.u2fld input{box-sizing:border-box;height:56px;line-height:1.2;}
/* ⛔ 폰의 날짜 칸은 값을 **오른쪽에 붙여** 그린다. 상자 오른쪽 안쪽 여백(16px)과 겹쳐서
   「2026. 9. 7.」의 끝점이 잘려 보였다 (사장님 지적 2026-09-10 : 「언제 칸이 오른쪽이 잘렸어」).
   ⛔ 폰이 제 나름대로 그리는 것을 끄고(appearance:none) 값을 **왼쪽에 붙인다.**
      다른 칸(이름·금액)도 다 왼쪽이라 줄도 맞는다. */
.u2fld input[type=date],.u2fld input[type=month]{-webkit-appearance:none;appearance:none;
  text-align:left;}
.u2fld input[type=date]::-webkit-date-and-time-value,
.u2fld input[type=month]::-webkit-date-and-time-value{text-align:left;margin:0;}
/* ⛔ 창 속은 **위아래로만** 움직인다. 무엇이 조금 삐져나가도 옆으로 흔들리지 않게 못 박는다. */
.u2pop-b{overflow-x:hidden;}

/* ── 아래 다섯 칸 · 면으로 된 픽토그램 ─────────────────────
   ⛔ 이모지를 안 쓴다 — 폰마다 그림이 달라진다. 여기 것은 우리가 그린 것이라 어디서나 같다. */
/* ⛔ **키를 최소로** (사장님 2026-09-09 : 「네비게이션바의 영역이 너무 많아」).
      8+6+24+4+12+6 → 4+2+22+2+11+2. 폰 아래쪽 안전칸(safe-area)은 그대로 둔다 — 그건 기기 몫이다.
   ⛔ 바탕을 흰색(--paper)이 아니라 **배경과 같은 톤(--bg)**으로 하고 경계선을 뺐다.
      가르는 일은 **그림자**가 한다 (사장님 2026-09-09 : 「색상 하얗게 가져가지말고
      배경과 같은톤으로 하돼 영역구분을 그림자로 할것」). */
/* ⛔ **떠 있는 막대**다 (사장님 2026-09-11 : 「네비게이션이 숨었다가 액션하면 등장하고
      해서 하단 공간을 살리자 · 플로팅 된 모양으로」).
   · 바닥에 붙지 않는다 — 좌우 12px · 아래 --navgap 만큼 띄우고 둥글린다.
   · 폭은 본문(460px)에 맞춘다. 안 맞추면 PC 에서 막대만 화면 끝까지 늘어난다.
   ⛔ left:0;right:0 을 남겨 둔 채 margin:auto 로 가운데 놓는다. transform 으로 가운데를
      잡으면 **숨기는 움직임(translateY)과 부딪친다.** */
.u2tabs{position:fixed;left:0;right:0;bottom:calc(var(--navgap) + env(safe-area-inset-bottom));
  margin:0 auto;width:min(436px, calc(100% - 24px));
  z-index:40;background:var(--bg);height:var(--tabh);padding:0;border-radius:24px;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:0 10px 30px rgba(20,24,10,.18);
  transition:transform .26s cubic-bezier(.4,0,.2,1), opacity .18s linear;}
/* 비킬 때 — 아래로 내려보낸다. ⛔ display:none 이 아니다. 그러면 돌아올 때 뚝 나타난다. */
body.u2navoff .u2tabs{transform:translateY(calc(100% + var(--navgap) + env(safe-area-inset-bottom) + 14px));
  opacity:0;pointer-events:none;}
/* 막대가 비켜 있을 때만 살아나는 **되부르는 자리** — 화면 맨 아래를 톡 건드리면 돌아온다.
   ⛔ 평소에는 pointer-events:none 이다. 안 그러면 화면 맨 아랫줄이 안 눌린다. */
.u2navpeek{position:fixed;left:0;right:0;bottom:0;height:calc(22px + env(safe-area-inset-bottom));
  z-index:39;pointer-events:none;}
body.u2navoff .u2navpeek{pointer-events:auto;}

/* 🔴 **＋ 는 막대 안에 온전히 앉는다** (사장님 2026-09-12 : 「네비게이션에 동그라미를
   아예 플로팅 바 중앙에 배치하자 지금처럼 튀어나오니까 불안정해」).
   막대가 바닥에 붙어 있던 때는 위로 올라타는 것이 맞았다(2026-09-10). 그런데 막대를
   **떠 있게** 바꾸고 나니, 떠 있는 것 위에 또 하나가 얹혀 **어디에도 안 붙어 보인다.**
   ⛔ 튀어나오는 몫(margin-top:-30px)을 없앤다. 66px 막대 안에 50px 동그라미가 앉는다.
   ⛔ 그림자(sh2)는 남긴다 — 막대와 같은 먹색이라 그림자가 없으면 경계가 사라진다.
   ⚑ 이 값을 다시 튀어나오게 고치면 **알림창 높이(--navbase + 10px)도 같이 올려야** 한다.
      앞서 34px 이던 것이 그 몫이었다. */
.u2tab-plus .u2tab-ic{width:50px;height:50px;border-radius:99px;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;margin-top:0;box-shadow:var(--sh2);}
.u2tab-plus svg{width:24px;height:24px;}
.u2tab-plus .u2tab-lb{display:none;}
/* ⛔ 자판이 올라오면 아래 것들을 **통째로 감춘다** (사장님 2026-09-09 : 「키보드가 올라오면서
   네비게이션바가 올라오는데 이때 네비게이션 안보이게 할것」).
   폰 자판은 position:fixed 를 밀어 올려서, 그대로 두면 고르던 칩을 덮는다. */
body.u2typing .u2tabs, body.u2typing .u2calc{display:none;}
.u2calc{position:fixed;right:14px;bottom:calc(var(--navbase) + 12px);z-index:45;
  transition:bottom .26s cubic-bezier(.4,0,.2,1),opacity .18s ease,transform .18s ease;
  width:58px;height:58px;border-radius:99px;background:var(--acc);color:var(--ink);
  display:grid;place-items:center;box-shadow:0 0 0 3px var(--ink),var(--sh2);}
/* ⛔ **강조색 + 검은 테두리** (사장님 2026-09-28 : 검은 단추가 옆의 검은 「하루 밥값」 칸과 겹쳐 보인다 → C 연두).
   색을 못박지 않고 테마 강조색(--acc)을 따른다 — 체리는 핑크, 블루체크는 노랑. 11개 테마 전부 확인함.
   ⛔ var(--ink) 배경으로 되돌리지 말 것. */
.u2calc svg{width:26px;height:26px;fill:currentColor;}
/* 🔴 **내리는 동안엔 숨는다** (사장님 2026-09-28 : 계산기 단추가 「3개월 버틸 때」·「다 냈어」·「찾기」를 가린다 → A).
   화면을 굴리는 동안 글자를 가리지 않게 살짝 내려가며 사라지고, 멈추면 0.6초 뒤 다시 선다.
   ⛔ display:none 으로 하지 말 것 — 자리가 흔들린다. 누름만 막는다. */
body.u2scrolling .u2calc{opacity:0;transform:translateY(14px);pointer-events:none;}
/* bgm.js 가 이 단추를 눌러 소리를 켠다. 화면엔 안 보인다(설정에서 켠다). */
/* 소리 켜고 끄기 — 톱니 바로 위. 그림은 bgm.js 가 넣어 준다 */
.u2snd{margin-left:auto;width:44px;height:44px;border-radius:99px;background:var(--paper);
  color:var(--sub);display:grid;place-items:center;box-shadow:var(--sh);flex:0 0 44px;}
.u2snd svg{width:21px;height:21px;stroke:currentColor;}
.u2snd.on{background:var(--acc);color:var(--ink);}

/* ── 올라오는 창 ────────────────────────────────────────
   ⛔ 머리(✕)와 속을 두 층으로 못 박는다 (사장님 2026-09-08 : 「✕ 가 안 보여」). */
.u2pop{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.42);display:none;}
.u2pop-on{display:block;}
/* 🔴 **창이 떠 있는 동안 뒤 화면은 안 움직인다** (사장님 2026-09-21 : 「계산기 켜두고 뒤에
   화면을 드래그해서 화면을 보려고 하면 따라 올라가버려」). 창은 fixed 로 화면을 다 덮지만,
   그 위에서 민 손가락이 **뒤 본문으로 흘러들어가**(스크롤 체이닝) 본문이 같이 올라갔다.
   ⛔ overflow:hidden 하나로는 아이폰에서 안 막힌다 — 보던 자리를 기억했다가 position:fixed 로 세우고,
      창을 닫을 때 그 자리로 돌려놓는다(창잠금()).
   ⛔ 창 **안쪽**(.u2pop-b)은 그대로 굴러간다. 막는 것은 뒤 화면뿐이다. */
body.u2popping{position:fixed;left:0;right:0;width:100%;overflow:hidden;}
/* ⛔ 74vh 로는 **마지막 단추가 화면 밑에 걸린다** (사장님 2026-09-11 : 「잘려보이지 않게」 —
   「고정지출 새로」의 「넣기」가 바닥에 붙어 있었다). 계산기에 해 둔 것과 같이 위로 더 올리고
   아래에 손가락 하나 몫을 둔다. */
.u2pop-in{position:absolute;left:0;right:0;bottom:0;background:var(--paper);
  border-radius:22px 22px 0 0;padding:0 16px calc(22px + env(safe-area-inset-bottom));
  max-height:86vh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;}
/* 🔴 **알약이 두 줄로 접히면 줄 사이가 붙는다** (사장님 2026-09-11 :
   「고정지출 새로에서 알약간에 행간이나 알약사이의 여백이 없음」).
   app.css 의 .chips 는 가로 사이만 벌려 두어서, 줄이 바뀌는 자리는 위아래가 딱 붙는다.
   ⛔ app.css 를 고치지 않는다 — 옛 화면(A)이 같이 읽는다. 여기서만 덮는다.
   ⛔ 반 이름 앞에 body 를 붙여 이긴다. app.css 가 더 뒤에 오는 자리가 있다. */
body .chips{row-gap:9px;}
/* 지나간 달 결산 — 들어온 돈과 나간 돈을 **같은 크기로** 나란히 (2026-09-11) */
.u2sum2{margin:8px 0 2px;}
.u2sum2-r{display:flex;align-items:baseline;gap:10px;padding:8px 3px;}
.u2sum2-r + .u2sum2-r{border-top:1px solid var(--line);}
.u2sum2-r span{color:var(--sub);font-size:15px;}
.u2sum2-r b{margin-left:auto;font-family:var(--ff),var(--ffui);font-weight:800;font-size:26px;
  white-space:nowrap;}

/* 처음 설정 (2026-09-11 · 2026-09-12 토스처럼 줄임) */
/* ── 아래로 당겨서 새로 받기 (2026-09-12) ──────────────
   ⛔ 브라우저가 저 혼자 하는 당겨서 새로고침을 **끈다**(overscroll-behavior).
      안 끄면 우리 것과 둘이 같이 돌아 화면이 통째로 다시 뜬다.
      홈 화면에 놓은 앱에는 브라우저 것이 아예 없어서, 우리 것이 없으면 새로 받을 길이 없다. */
html, body{overscroll-behavior-y:contain;}
.u2pull{position:fixed;top:10px;left:50%;z-index:55;transform:translate(-50%,0);
  width:38px;height:38px;border-radius:99px;background:var(--paper);box-shadow:var(--sh2);
  display:grid;place-items:center;opacity:0;pointer-events:none;}
.u2pull i{width:17px;height:17px;border-radius:99px;display:block;
  border:2.5px solid color-mix(in srgb,var(--ink) 18%,transparent);border-top-color:var(--ink);}
/* 충분히 당겼다 — 놓으면 간다는 표시 */
.u2pull-go i{border-color:color-mix(in srgb,var(--ink) 30%,transparent);border-top-color:var(--ink);}
/* ⛔ 이름을 u2spin 으로 두면 도장 「팔랑」(491 의 u2spin)을 덮어써서 팔랑이 빙글 돌기만 했다 (2026-09-28 고침) */
.u2pull.on i{animation:u2pullspin .7s linear infinite;}
@keyframes u2pullspin{to{transform:rotate(360deg)}}

/* 이전으로 — 제목 위 왼쪽. ⛔ 작게 두되 **글자로** 적는다. 화살표만 있으면 못 찾는 분이 있다. */
.u2sp-back{display:inline-block;margin:-2px 0 8px -4px;padding:4px;color:var(--sub);
  font-size:15px;font-weight:700;position:relative;}
.u2sp-back::after{content:'';position:absolute;inset:-10px -8px;}

/* 인사 화면 — 위로는 **세 줄 안에.** 길면 그것도 짐이 된다 */
.u2sp-hi{color:var(--sub);font-size:16px;line-height:1.7;margin:2px 0 4px;}
.u2sp-hi b{color:var(--ink);font-weight:800;}

/* 🔴 **묻는 값은 크게.** 토스가 그렇듯 화면에서 제일 큰 것이 손님이 채울 칸이라야 한다.
   ⛔ 「원」을 칸 안 오른쪽에 붙인다 — 따로 두면 무엇을 넣는 칸인지 한 박자 늦게 안다. */
.u2sp-big{display:flex;align-items:baseline;gap:6px;background:var(--paper);
  border:2px solid var(--line2);border-radius:var(--r-box);padding:14px 16px;margin-bottom:2px;}
.u2sp-big input{flex:1;min-width:0;border:0;background:none;outline:none;padding:0;
  font-family:var(--ff),var(--ffui);font-weight:800;font-size:30px;color:var(--ink);}
.u2sp-big span{flex:0 0 auto;font-family:var(--ff),var(--ffui);font-weight:800;font-size:22px;color:var(--sub);}
.u2sp-big:focus-within{border-color:var(--ink);}
.u2sp-h{margin-bottom:16px;}
.u2sp-h span{display:inline-block;background:var(--acc);color:var(--ink);border-radius:99px;
  padding:3px 10px;font-size:13px;font-weight:800;margin-bottom:8px;}
.u2sp-h b{display:block;font-family:var(--ff),var(--ffui);font-size:24px;font-weight:800;line-height:1.3;}
.u2sp-h small{display:block;color:var(--sub);font-size:16px;margin-top:5px;line-height:1.5;}
/* 🔴 **곁말 속 굵은 글씨까지 제목이 되면 안 된다** (2026-09-12 화면 확인).
   위 `.u2sp-h b` 가 display:block · 24px 이라, 곁말(small) 안의 <b> 까지 그 규칙을 받아
   「월세·보험·구독처럼 / **매달 같은 날** / 빠지는 것」 처럼 세 동강이 났다.
   ⛔ 안쪽 것을 따로 되돌려 놓는다. */
.u2sp-h small b{display:inline;font-family:inherit;font-size:inherit;font-weight:800;color:var(--ink);}
/* ⛔ 「건너뛰기」를 **작게 숨기지 않는다.** 못 찾으면 그냥 창을 닫아 버리고,
   그러면 다시 안 돌아온다. 나란히 둔다 — 대신 「다음」이 눈에 먼저 든다.
   🔴 **단추 줄은 바닥에 붙어 있는다**(sticky). 셋째 걸음은 줄이 늘어나면 길어지는데,
      그냥 두면 「다 됐어」가 창 밖으로 반쯤 걸려 안 보인다 (2026-09-12 화면 확인).
      계산기에 해 둔 「하단이 잘리지 않고 고정」과 같은 규칙이다. */
.u2sp-btm{display:flex;align-items:center;gap:10px;margin-top:20px;
  position:sticky;bottom:0;background:var(--paper);padding:8px 0 2px;}
.u2sp-skip{flex:0 0 auto;padding:14px 6px;color:var(--sub);font-size:15px;font-weight:700;}
.u2sp-btm .go{flex:1 1 auto;border-radius:var(--r-box);padding:15px;font-weight:800;font-size:17px;
  background:var(--ink);color:var(--bg);}

/* 달마다 모은 것 — 막대 열둘 (2026-09-11) */
/* 번개장터식 (2026-09-14) — 막대 위 짧은 금액 · 보는 달만 테마색 */
.u2bars{display:flex;align-items:flex-end;gap:7px;margin:18px 0 4px;height:122px;}
.u2bar{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
.u2bar-v{font-size:11.5px;color:var(--faint);font-weight:700;margin-bottom:6px;white-space:nowrap;letter-spacing:-.3px;}
/* ⛔ 저축·투자를 **색으로 나누지 않는다** (사장님 2026-09-14 : 분홍 두 톤 · 검정/분홍 · 회색 없는 두 색까지 보시고
   「색을 2개로 나누지말자 맨처음했던 막대바에 금액써진걸로하자」). 한 막대 한 색 — 그 달 나눔은 위 한 줄이 적는다. */
.u2bar-c{width:100%;border-radius:7px;background:color-mix(in srgb,var(--ink) 9%,transparent);}
.u2bar-m{font-size:12px;color:var(--faint);font-weight:700;line-height:1;margin-top:8px;white-space:nowrap;letter-spacing:-.3px;}
.u2bar-now .u2bar-c{background:var(--pop);}
.u2bar-now .u2bar-v,.u2bar-now .u2bar-m{color:var(--pop);}
/* 고정지출 창 대출 칸 */
.u2fx-2{display:flex;gap:8px;}
.u2fx-2 > div{flex:1 1 0;min-width:0;}
.u2fx-2 input{width:100%;}
.u2fx-s{display:block;font-size:13px;color:var(--faint);font-weight:700;margin:8px 0 4px;}
.u2barleg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--faint);font-weight:700;margin-top:10px;}
.u2barleg i{width:9px;height:9px;border-radius:3px;display:inline-block;}
.u2barleg .u2leg-a{background:var(--ink);}
.u2barleg .u2leg-b{background:var(--acc);margin-left:8px;}
/* ＋ 더하기 알약 — 점선이라 **고르는 것이 아니라 만드는 것**임이 한눈에 보인다 */
.chips .chip.u2addchip{border-style:dashed;border-width:1.5px;color:var(--sub);font-weight:700;}
.u2pop-h{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:18px 0 12px;
  border-bottom:1px solid var(--line);margin-bottom:10px;}
.u2pop-h b{font-family:var(--ff),var(--ffui);font-size:21px;font-weight:800;}
.u2pop-h .x{margin-left:auto;width:34px;height:34px;border-radius:99px;
  background:color-mix(in srgb,var(--ink) 6%,transparent);font-size:18px;}
.u2pop-b{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:0 12px 6px 0;scrollbar-gutter:stable;}
.u2pop-b::-webkit-scrollbar{width:6px;}
.u2pop-b::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;}
@media (min-width:700px) and (pointer:fine){
  .u2pop{display:none;place-items:center;padding:24px;}
  .u2pop-on{display:grid;}
  .u2pop-in{position:relative;left:auto;right:auto;bottom:auto;margin:0;
    width:min(440px,100%);border-radius:22px;max-height:62vh;padding:0 18px 18px;}
  .u2pop-b{max-height:46vh;}
  .u2pop.u2pop-calc{display:none;background:rgba(0,0,0,.14);padding:24px;}
  .u2pop.u2pop-calc.u2pop-on{display:grid;align-items:center;justify-items:end;}
  .u2pop-calc .u2pop-in{width:244px;max-width:244px;height:auto;max-height:calc(100vh - 48px);
    border-radius:20px;padding:0 12px 12px;}
  .u2pop-calc .u2pop-b{max-height:none;}
  .u2pop-calc .u2pop-h{padding:14px 0 8px;}
  .u2pop-calc .u2pop-h b{font-size:17px;}
  .u2pop-calc .u2disp{font-size:24px;min-height:46px;padding:10px 12px;}
  .u2pop-calc .u2keys{gap:6px;margin-top:8px;}
  .u2pop-calc .u2keys button{padding:10px 0;font-size:18px;border-radius:13px;}
}
.u2list-row{display:flex;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);}
.u2list-row:last-of-type{border-bottom:0;}
.u2list-row .d{flex:0 0 46px;color:var(--faint);font-size:16px;}
/* 낸 십일조 밑에 붙는 「이 돈에서 냈어」 (2026-09-15) */
/* ⛔ **날짜 칸 밑으로 들여 쓰지 않는다** (사장님 2026-09-15 : 「너무 좁아 날짜앞에 여백이 많으니까 수정하자 ·
   이돈에서 냈어 위에 선이 있으니까 둘중에 하나만 표현해」). 상자를 폭 전부로 펴고, 상자가 붙은 줄은 밑줄을 안 긋는다. */
.u2tb{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--line);font-size:14.5px;line-height:1.5;}
.u2list-row:has(+ .u2tb){border-bottom:0;padding-bottom:8px;}
.u2tb-h{color:var(--sub);display:flex;justify-content:space-between;gap:8px;}
.u2tb-h b{color:var(--ink);font-family:var(--ff),var(--ffui);}
.u2tb-r{display:flex;gap:8px;padding-top:4px;}
.u2tb-r span:first-child{flex:0 0 38px;color:var(--faint);}
.u2tb-r span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.u2tb-r b{color:var(--in,#2f7a5a);font-family:var(--ff),var(--ffui);white-space:nowrap;}
.u2list-row .n{flex:1;min-width:0;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 곁말이 붙은 줄은 두 줄로 흐른다 (한 줄에 이으면 이름까지 잘린다) */
.u2list-row .n.u2r-two{white-space:normal;text-overflow:clip;}
.u2list-row{align-items:flex-start;}
.u2list-row .d,.u2list-row .a{padding-top:1px;}
.u2list-row .a{flex:0 0 auto;font-family:var(--ff),var(--ffui);font-weight:800;font-size:17px;}
/* 십일조 바탕에서 빼기 ✕ · 되살리기 (2026-09-16) — 보이는 동그라미는 26px, 닿는 자리는 44px */
.u2ntx{flex:0 0 26px;width:26px;height:26px;margin-top:-1px;border-radius:99px;position:relative;
  background:var(--line);color:var(--sub);font-size:13px;font-weight:800;display:grid;place-items:center;}
.u2ntx::after{content:'';position:absolute;inset:-9px;}
.u2ntback{flex:0 0 auto;border-radius:99px;padding:4px 11px;background:var(--line);color:var(--ink);
  font-size:14px;font-weight:700;position:relative;}
.u2ntback::after{content:'';position:absolute;inset:-9px -4px;}
.u2list-row.u2off .n,.u2list-row.u2off .a{color:var(--faint);text-decoration:line-through;}
/* 🔴 **금액은 절대 두 줄이 되면 안 된다** (사장님 2026-09-12 : 「회색박스에 설명글은
   개행해주고 금액은 절대 2줄로 적히면 안돼」 — 「643,649」/「원」으로 끊겨 있었다).
   앞서는 설명과 금액이 같은 칸을 두고 다퉜다. 설명이 길면 금액을 밀어붙여 숫자가 접힌다.
   ⛔ 금액에 **flex:0 0 auto + nowrap** 을 준다 — 금액이 먼저 자리를 잡고, 남는 자리를
      설명이 쓴다. 설명은 두 줄이 되어도 읽히지만 숫자는 접히면 숫자가 아니다.
   ⛔ 설명은 **낱말 안에서 안 끊는다**(keep-all) — 「고정지/출」처럼 끊기던 것이 그것이다. */
.u2list-sum{display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:var(--r-box);
  padding:13px 15px;margin-bottom:12px;font-size:16px;}
.u2list-sum > span{flex:1 1 auto;min-width:0;line-height:1.45;word-break:keep-all;}
.u2list-sum b{flex:0 0 auto;font-family:var(--ff),var(--ffui);font-size:21px;white-space:nowrap;}
.u2grp{margin-bottom:16px;}
.u2grp:last-of-type{margin-bottom:0;}
.u2grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding-bottom:6px;border-bottom:2px solid var(--ink);}
.u2grp-h b,.u2grp-h span{font-family:var(--ff),var(--ffui);font-size:20px;font-weight:800;}
.u2grp-s{color:var(--faint);font-size:17px;padding:7px 0 2px;}

/* 설정 줄 */
.u2set{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 4px;border-bottom:1px solid var(--line);}
.u2set:last-of-type{border-bottom:0;}
/* ⛔ 설정창은 **나이 드신 분이 제일 오래 들여다보는 화면**이다
   (사장님 2026-09-12 : 「설정창도 너무 글씨가 작아」). 본문보다 한 치수 크게 둔다. */
/* ⛔ 2026-09-15 하루에 세 번 맞췄다 (사장님) : 40% 키움(19→27 · 17→24) → 「10% 줄이자」(24 · 22) → **「설정크기 칸 20%더 줄여주고」(19 · 18 · 칸 위아래 15→12)**.
   ⛔ 여기는 입력칸이 아니라 확대(16px) 걱정은 없다. 다시 바꾸실 땐 이 셋과 위 .u2set 의 padding 을 같이 본다. */
.u2set b{font-size:19px;font-weight:700;}
.u2set small{display:block;color:var(--faint);font-size:18px;margin-top:3px;line-height:1.45;}
.u2set .rt{margin-left:auto;color:var(--sub);font-size:18px;flex:0 0 auto;}
.u2vol input[type=range]{display:block;width:100%;margin-top:12px;accent-color:var(--ink);}
.u2set.hot b{color:var(--pop);}
.u2sw{margin-left:auto;width:52px;height:30px;border-radius:99px;flex:0 0 52px;
  background:color-mix(in srgb,var(--ink) 14%,transparent);position:relative;transition:background .15s;}
.u2sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:99px;
  background:var(--paper);box-shadow:var(--sh);transition:transform .15s;}
.u2sw.on{background:var(--in);}
.u2sw.on:after{transform:translateX(22px);}
/* ── 이용권 · 결제 ─────────────────────────────────────
   ⛔ 새 색을 만들지 않는다. 배경마다 색이 갈리는 앱이라, 여기서 색을 박으면
      배경 열한 벌 가운데 어딘가에서 반드시 안 보이는 자리가 생긴다.
      (카카오페이 노랑 하나만 예외다 — 그건 카카오가 정한 색이다) */
/* 결제 자국 한 줄 — 「받음」이 아닌 것은 테두리로 눈에 걸리게 한다 */
.u2try{border:1px solid var(--line2);border-radius:var(--r-box);padding:13px 14px;margin-bottom:10px;}
.u2try.hot{border-color:var(--pop);border-width:2px;}
.u2try b{font-size:16px;font-weight:800;}
.u2trypid{font-size:13px;color:var(--faint);margin-top:5px;word-break:break-all;line-height:1.45;}
.u2try .u2more{margin-top:9px;}
/* 예시 표 — 눈에 걸리되 화면을 안 잡아먹게 한 줄로 */
.u2demo{background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 15px;
  font-size:16px;font-weight:600;text-align:center;margin-bottom:12px;line-height:1.5;}
.u2demo b{font-weight:800;}
/* 누르면 결제로 (사장님 2026-09-24 「데모 보다가 결제하고 싶어지면 어디 눌러야 돼?」 → 이 띠를 누르게) */
.u2demo{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.u2demo:active{transform:scale(.98);}
.u2demo .u2demo-go{display:inline-block;margin-left:6px;font-weight:800;}
.u2paybar{display:flex;align-items:center;gap:12px;background:var(--paper);
  border-radius:var(--r-card);box-shadow:var(--sh);padding:15px 16px;margin-bottom:14px;
  border:2px solid var(--pop);}
.u2paybar > div{min-width:0;flex:1;}
.u2paybar b{display:block;font-size:17px;font-weight:800;}
.u2paybar small{display:block;color:var(--sub);font-size:16px;margin-top:3px;line-height:1.5;}
.u2paybar button{flex:0 0 auto;background:var(--ink);color:var(--bg);border-radius:99px;
  padding:11px 16px;font-weight:800;font-size:15px;}
/* 🎟️ 이용권 표 (2026-09-15 · B안 아기자기) — 점선 테두리 · 양옆 반달 홈 · 값은 손글씨 */
.u2tk{position:relative;margin:6px 2px 16px;padding:18px 16px 16px;text-align:center;
  background:color-mix(in srgb,var(--acc) 38%,var(--paper));border:2px dashed var(--line2);border-radius:22px;}
.u2tk::before,.u2tk::after{content:"";position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;
  border-radius:50%;background:var(--paper);border:2px dashed var(--line2);}
.u2tk::before{left:-13px;clip-path:inset(0 0 0 50%);}
.u2tk::after{right:-13px;clip-path:inset(0 50% 0 0);}
.u2tk-early{display:inline-block;margin-bottom:6px;padding:3px 11px;border-radius:99px;
  background:var(--pop);color:var(--paper);font-size:14px;font-weight:800;}
.u2tk-e{font-size:30px;line-height:1;}
.u2tk-v{font-family:'lb-ahyoung',var(--ff),var(--ffui);letter-spacing:.5px;font-weight:800;font-size:44px;line-height:1.15;margin-top:4px;color:var(--ink);}
.u2tk-v small{font-size:20px;margin-left:2px;}
.u2tk-v s{display:block;font-size:17px;color:var(--faint);font-weight:600;}
.u2tk-s{font-family:'lb-ahyoung',var(--ff),var(--ffui);letter-spacing:.5px;font-size:18px;color:var(--sub);margin-top:4px;}
.u2tk-keep{display:flex;gap:8px;align-items:flex-start;margin:0 2px 14px;padding:11px 13px;border-radius:16px;
  background:var(--bg);font-size:16px;line-height:1.5;color:var(--sub);}
.u2tk-keep b{color:var(--ink);}
.u2tk-foot{margin:12px 2px 0;text-align:center;font-size:14px;color:var(--faint);line-height:1.6;}
.u2tk-foot a{color:var(--sub);text-decoration:underline;}
.u2pay-split{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0;}
.u2pay-split > div{border-radius:var(--r-box);padding:13px 12px;background:var(--bg);}
.u2pay-split b{display:block;font-size:16px;font-weight:800;margin-bottom:7px;}
.u2pay-split em{display:block;font-style:normal;font-size:16px;line-height:1.55;color:var(--sub);}
.u2pay-split .no{background:var(--paper);box-shadow:inset 0 0 0 2px var(--line2);}
.u2pay-split .no b{color:var(--out);}
.u2pay-v{font-family:var(--ff),var(--ffui);font-weight:800;font-size:38px;
  text-align:center;margin:16px 0 6px;letter-spacing:-1px;}
.u2pay-v small{font-size:19px;margin-left:2px;}
.u2pay-v s{color:var(--faint);font-size:23px;font-weight:700;margin-right:9px;}
.u2kakao{display:block;width:100%;background:#FEE500;color:#191600;border-radius:var(--r-box);
  padding:16px;font-weight:800;font-size:17px;margin-bottom:9px;}
.u2paynote{color:var(--sub);font-size:16px;line-height:1.6;margin:2px 2px 14px;text-align:center;}
/* ── 찾기 · 분류 고치기 · 폰에 놓아두기 · 잘 쓰고 계세요 ────────
   ⛔ 옛 화면을 숨긴 뒤, 손님이 못 쓰게 된 것들을 이리로 옮겨 왔다 (2026-09-08 밤).
      「손님이 지금 못 하는 것 있어선 안 돼」 — 사장님 지시. */

/* 찾기 */
/* 「이 달에 적은 것」 머리 — 양옆은 안 접히게 못 박고, 가운데만 두 줄로 흐르게 둔다 */
.u2listhead{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.u2listhead > b{flex:0 0 auto;white-space:nowrap;font-family:var(--ff),var(--ffui);font-size:20px;}
.u2listhead .u2sub{flex:1;min-width:0;line-height:1.5;}
/* 합계 두 줄을 누를 수 있게 — 보이기는 그대로 글자다. 단추처럼 안 보이게 둔다.
   ⛔ 닿는 자리는 ::after 로만 넓힌다(위 「손가락이 닿는 자리」와 같은 규칙). */
.u2sumtap{color:inherit;font:inherit;text-align:left;position:relative;}
/* ⛔ **보이는 크기는 안 키운다.** 글줄이라 키우면 칸이 뚱뚱해진다 —
   ::after 로 **닿는 자리만** 44px 까지 넓힌다 (폰점검 규칙, 글자 높이 20 + 12×2 = 44). */
.u2sumtap::after{content:'';position:absolute;inset:-12px -6px;}
/* 내역을 갈라 보는 알약 (2026-09-11) */
.u2txf{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px;}
.u2txf-b{border:1.5px solid var(--line2);border-radius:99px;padding:7px 13px;
  font-size:16px;font-weight:700;color:var(--sub);background:var(--paper);white-space:nowrap;
  position:relative;}
/* 알약 높이는 30px 이다. 보이는 크기는 그대로 두고 닿는 자리만 44px 로 (30 + 7×2). */
.u2txf-b::after{content:'';position:absolute;inset:-7px 0;}
.u2txf-on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
/* 고정지출 비고 — 이름 밑에 한 줄 */
.u2r-two{white-space:normal;}
.u2memo{display:block;font-style:normal;font-size:15px;font-weight:400;color:var(--faint);
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;}
.u2findbtn{flex:0 0 auto;white-space:nowrap;margin-left:auto;background:var(--bg);
  border-radius:99px;padding:7px 13px;
  font-size:16px;font-weight:800;color:var(--sub);display:flex;align-items:center;gap:5px;}
.u2findbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;}
.u2findbar{display:flex;align-items:center;gap:9px;background:var(--bg);
  border-radius:var(--r-box);padding:13px 15px;margin-bottom:14px;}
.u2findbar input{flex:1;min-width:0;background:none;border:0;font-size:18px;color:var(--ink);}
.u2findsum{display:flex;justify-content:space-between;align-items:baseline;
  margin:2px 2px 12px;font-size:15px;color:var(--sub);}
.u2findsum b{color:var(--ink);font-size:16px;}

/* 분류 고치기 */
.u2cat-h{font-size:15px;font-weight:800;margin:16px 2px 7px;}
.u2cat-h:first-child{margin-top:0;}
.u2cat-h small{display:block;color:var(--sub);font-weight:400;font-size:16px;margin-top:2px;}
/* 분류 ✕ 알약 (2026-09-15) */
.u2cxs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;}
.u2cx{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line2);border-radius:99px;
  padding:3px 12px;font-size:15px;font-weight:700;background:var(--paper);max-width:100%;}
.u2cx:has(button){padding-right:3px;}
.u2cx button{width:30px;height:30px;border-radius:99px;color:var(--faint);font-size:14px;flex:0 0 auto;}

/* 결제수단마다 언제 빠지나 (2026-09-15) */
.u2pls{margin:4px 0 6px;}
.u2pl{border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;}
.u2pl > .u2pl-row{flex:1 1 0;min-width:0;}
.u2pl > .u2pl-pick,.u2pl > .u2pl-warn{flex:0 0 100%;}
.u2pl-x{flex:0 0 auto;width:36px;height:36px;margin-left:4px;border-radius:99px;color:var(--faint);font-size:16px;}
.u2pl:last-child{border-bottom:0;}
.u2pl-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 2px;}
.u2pl-row b{font-size:18px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.u2pl-tag{margin-left:auto;flex:0 1 auto;text-align:right;font-size:15px;font-weight:700;border-radius:99px;
  padding:4px 11px;background:var(--line);color:var(--sub);}
.u2pl-tag.card{background:var(--ink);color:var(--bg);}
.u2pl-pick{margin:0 0 12px;}
.u2pl-warn{color:var(--pop);font-size:15px;margin:-4px 2px 10px;line-height:1.45;}
/* ⛔ **18px 아래로 내리지 말 것** (사장님 2026-09-15 : 「분류를 쓰려고 하면 화면이 확대되어버려」).
   문서에 zoom 0.9(작게)가 걸려 16px 는 화면에서 14.4px 가 되고, 아이폰은 16px 보다 작은 칸에 손이 닿으면 화면을 확대한다.
   18 × 0.9 = 16.2 · 아래 바닥값 규칙과 같은 까닭이다. */
.u2catin{width:100%;background:var(--bg);border:0;border-radius:var(--r-box);
  padding:14px 15px;font-size:18px;line-height:1.6;color:var(--ink);resize:vertical;}

/* 폰에 놓아두기 */
/* 홈에 놓는 걸음 — 한 걸음이 한 줄이다. ⛔ 한 덩어리 글로 적지 않는다
   (사장님 2026-09-09 : 「홈에 설치하는 가이드를 더 자세히 쉽게」).
   손이 따라가야 하는 글은 번호가 붙어 있어야 어디까지 했는지 안 잃는다. */
.u2step{display:flex;gap:10px;align-items:flex-start;padding:9px 0;line-height:1.6;font-size:15.5px;}
.u2step + .u2step{border-top:1px solid var(--line);}
.u2step > i{flex:0 0 22px;height:22px;border-radius:99px;background:var(--ink);color:var(--bg);
  font-style:normal;font-size:15px;font-weight:800;display:grid;place-items:center;margin-top:1px;}
.u2steps{background:var(--bg);border-radius:var(--r-box);padding:6px 15px;margin-bottom:14px;}
.u2steps .u2note{display:block;color:var(--sub);font-size:16px;line-height:1.6;
  padding:10px 0 12px;border-top:1px solid var(--line);}
.u2qr{display:flex;gap:16px;align-items:center;background:var(--bg);
  border-radius:var(--r-box);padding:15px;margin:14px 0;}
.u2qr img{width:132px;height:132px;flex:0 0 auto;background:#fff;border-radius:10px;padding:6px;}
.u2qr-s{min-width:0;font-size:15px;line-height:1.65;color:var(--sub);}
.u2qr-s b{color:var(--ink);}
.u2link{display:flex;align-items:center;gap:9px;background:var(--bg);
  border-radius:var(--r-box);padding:12px 14px;margin-bottom:14px;}
.u2link span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:15px;color:var(--sub);}
.u2link button{flex:0 0 auto;background:var(--ink);color:var(--bg);border-radius:99px;
  padding:8px 14px;font-size:16px;font-weight:800;}

/* 잘 쓰고 계세요 */
.u2use-i{background:var(--bg);border-radius:var(--r-box);padding:14px 15px;margin:12px 0;}
.u2use-i .n{font-size:18px;font-weight:800;}
.u2use-i .d{color:var(--sub);font-size:15px;margin-top:3px;}
.u2use-b{display:flex;gap:8px;}
.u2use-b button{flex:1;border-radius:var(--r-box);padding:13px 6px;font-size:15px;
  font-weight:800;background:var(--bg);color:var(--sub);
  display:flex;flex-direction:column;align-items:center;gap:5px;}
.u2use-b button em{font-style:normal;font-size:20px;line-height:1;}
.u2use-b .no{background:var(--paper);box-shadow:inset 0 0 0 2px var(--line2);}
.u2sell{display:flex;align-items:center;gap:10px;padding:11px 2px;
  border-bottom:1px solid var(--line);}
.u2sell:last-child{border-bottom:0;}
.u2sell .n{flex:1;min-width:0;font-size:16px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.u2sell .v{color:var(--sub);font-size:15px;flex:0 0 auto;}
.u2sell button{flex:0 0 auto;background:var(--bg);border-radius:99px;padding:8px 13px;
  font-size:16px;font-weight:800;color:var(--sub);}
.u2ansrow{display:flex;align-items:center;gap:9px;padding:11px 2px;
  border-bottom:1px solid var(--line);}
.u2ansrow:last-child{border-bottom:0;}
.u2ansv{font-style:normal;flex:0 0 74px;font-size:15px;font-weight:800;text-align:center;
  border-radius:99px;padding:5px 0;background:var(--bg);color:var(--sub);}
.u2ansv.no{background:var(--pop);color:var(--paper);}
.u2ansrow .n{flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.u2ansrow .n s{display:block;text-decoration:none;color:var(--faint);font-size:15px;}
.u2ansrow button{flex:0 0 auto;background:var(--bg);border-radius:99px;padding:8px 12px;
  font-size:16px;font-weight:800;color:var(--sub);}
.u2quick{display:flex;gap:8px;margin-top:9px;}
.u2quick button{flex:1;background:var(--bg);border-radius:var(--r-box);padding:11px 0;
  font-size:15px;font-weight:800;color:var(--sub);}
.u2btns{display:flex;gap:9px;margin-top:6px;}
.u2btns button{flex:1;border-radius:var(--r-box);padding:15px;font-weight:800;font-size:17px;}
.u2btns .ghost{border:2px solid var(--line2);background:var(--paper);color:var(--sub);}
.u2btns .go{background:var(--ink);color:var(--bg);}
.u2btns .hot{background:var(--pop);color:var(--paper);flex:0 0 92px;}

/* 계산기 */
.u2keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px;}
.u2keys button{border-radius:var(--r-box);padding:12px 0;font-size:20px;font-weight:800;
  background:color-mix(in srgb,var(--ink) 6%,transparent);}
.u2keys button.op{background:var(--acc);}
.u2keys button.eq{background:var(--ink);color:var(--bg);}
/* 이전 셈 — 시계 그림 하나로 여닫는다. 글자는 안 쓴다 */
.u2histbar{display:flex;justify-content:flex-end;padding:0 0 6px;}
.u2histbar button{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;
  color:var(--sub);background:color-mix(in srgb,var(--ink) 5%,transparent);}
.u2histbar button svg{width:19px;height:19px;}
.u2histbar button.on{background:var(--acc);color:var(--ink);}
.u2histbar button.dim{opacity:.3;}
/* ⛔ 104px 은 **두 줄**이다. 열 번까지 쌓아 두면서 두 줄만 보여 주면 쌓아 둔 뜻이 없다
   (사장님 지적 2026-09-10 : 「계산기에서 누적 누르면 누적된게 다 안보여」).
   창 높이의 3분의 1까지 내주고, 그보다 길면 그 안에서 구른다. */
/* ⛔ **다섯 줄까지** 보이고 그 안에서 구른다 (사장님 2026-09-11 : 「최대 5개씩 보이고 스크롤」).
   한 줄이 대략 32px 이다. 34vh 로 두면 작은 폰에서 두 줄, 큰 폰에서 여덟 줄이 되어
   화면마다 다르게 보였다. */
.u2hist{max-height:164px;overflow-y:auto;overscroll-behavior:contain;margin-bottom:8px;
  -webkit-overflow-scrolling:touch;}
/* 왼쪽으로 밀면 지워진다 — 미는 동안 손가락을 따라간다 */
.u2hist-r{transition:transform .18s ease, opacity .18s ease;touch-action:pan-y;}
/* 단추를 빨리 두 번 누르면 **화면이 확대된다** (사장님 2026-09-13 : 계산기 「0을 2번 클릭하면 화면확대됨」).
   아이폰은 두 번 톡이 확대라서, 계산기처럼 같은 단추를 잇달아 누르는 자리에서 꼭 걸린다.
   ⛔ 확대 자체(user-scalable=no)는 막지 않는다 — 글씨를 키워 보시는 분이 있다. 단추 위에서만 끈다. */
button,.chip,.u2tap,[data-k]{touch-action:manipulation;}
.u2hist-r{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
  padding:6px 2px;border-bottom:1px solid var(--line);font-size:15px;color:var(--sub);}
.u2hist-r:last-of-type{border-bottom:0;}
.u2hist-r b{margin-left:auto;font-family:var(--ff),var(--ffui);font-size:15px;color:var(--ink);}
.u2disp{background:var(--ink);color:var(--bg);border-radius:var(--r-box);padding:13px 15px;text-align:right;
  font-family:var(--ff),var(--ffui);font-weight:800;font-size:28px;word-break:break-all;min-height:54px;}
/* 계산기는 구르지 않는다 — 한 화면에 다 들어와야 손이 안 헛나간다 */
/* 🔴 **자판과 셈판은 자리를 지키고, 누적만 그 안에서 구른다** (사장님 2026-09-11 :
   「계산기가 아래로 밀려나고 있음 · 팝업창의 세로를 더 늘리고 최대 5개씩 보이고 스크롤이
   되게 하면서 하단이 잘리지 않고 고정되어야함」).
   앞서는 누적을 펼치면 그 높이만큼 자판이 통째로 아래로 밀려 마지막 줄이 화면 밖으로 나갔다.
   ⛔ 누적에 **flex:0 1 auto + min-height:0** 을 준다. 이 둘이 있어야 자리가 모자랄 때
      누적이 먼저 줄어든다 — 없으면 flex 는 글 상자를 안 줄이고 자판을 밀어낸다. */
.u2pop-b.u2calcbody{overflow:hidden;padding-right:0;scrollbar-gutter:auto;
  display:flex;flex-direction:column;}
.u2calcbody .u2histbar, .u2calcbody .u2disp, .u2calcbody .u2keys{flex:0 0 auto;}
.u2calcbody .u2hist{flex:0 1 auto;min-height:0;}
/* ⛔ 74vh 로는 **아래 자판 줄이 화면 밑에 걸린다** (사장님 지적 2026-09-10 :
   「하단이 잘려보여 위로 좀더 늘려」). 위로 더 올리고, 아래에도 손가락 하나 몫을 둔다.
   ⛔ 이전 셈을 펼치면 그만큼 더 길어지므로 높이를 넉넉히 잡아 둔다. */
@media (max-width:699px),(pointer:coarse){
  .u2pop.u2pop-calc .u2pop-in{max-height:92vh;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));}
}
.u2pop-b.u2calcbody::-webkit-scrollbar{display:none;}
/* 자판 네 줄은 모두 같은 모서리로 — 「지우기」 줄만 달라 보이지 않게 */
.u2pop-calc .u2keys button{border-radius:16px;}
.u2pop-calc .u2pop-h{border-bottom:0;margin-bottom:2px;}
.u2pop-meal .u2pop-h{border-bottom:0;margin-bottom:4px;}
.u2pop-calc .u2keys button{border:none;outline:none;box-shadow:none;}
.u2pop-calc .u2disp{border:none;box-shadow:none;}

/* 꾸미기(배경·글씨) */
.u2sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28);display:none;}
.u2sheet-on{display:block;}
@media (min-width:700px) and (pointer:fine){
  .u2sheet{display:none;place-items:center;padding:24px;}
  .u2sheet-on{display:grid;}
  .u2sheet-in{position:relative;right:auto;bottom:auto;width:min(420px,100%);height:min(560px,80vh);}
}
.u2sheet-in{position:absolute;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));
  width:min(340px,calc(100vw - 24px));height:min(440px,calc(100vh - 210px));
  background:var(--paper);border-radius:20px;box-shadow:var(--sh2);padding:16px 14px;overflow:auto;}
.u2sheet-in p{color:var(--sub);font-size:16px;margin:0 0 12px;}
/* ⛔ [hidden] 만으로는 안 숨는다 — display:grid 가 이긴다 */
.u2seg[hidden]{display:none;}
.u2seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:color-mix(in srgb,var(--ink) 6%,transparent);
  border-radius:99px;padding:5px;margin-bottom:14px;}
.u2seg-b{border-radius:99px;padding:8px;font-size:16px;font-weight:700;color:var(--sub);}
.u2seg-on{background:var(--paper);color:var(--ink);box-shadow:var(--sh);}
.u2pane{display:none;} .u2pane-on{display:block;}
.u2bglist{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.u2bgitem{border:1px solid var(--line2);border-radius:13px;padding:9px 7px 8px;background:var(--paper);
  text-align:center;display:block;}
.u2bgitem-on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
.u2bgitem-sw{display:block;position:relative;height:52px;margin-bottom:7px;overflow:hidden;
  background-color:var(--bg);border:1px solid rgba(0,0,0,.10);}
.u2bgitem-sw::after{content:'';position:absolute;inset:0;background-image:var(--pat);
  background-size:var(--pat-size);background-position:var(--pat-pos);opacity:var(--pat-a);}
.u2bgitem-sw::before{content:'';position:absolute;inset:0;z-index:1;background-image:var(--pat2);
  background-size:var(--pat2-size);background-position:var(--pat2-pos);opacity:var(--pat2-a);}
.u2bgitem-sw i{position:absolute;z-index:2;bottom:5px;right:6px;width:12px;height:12px;border-radius:50%;
  background:var(--acc);border:1px solid rgba(0,0,0,.15);}
.u2bgitem-sw i.b{right:21px;background:var(--acc2);}
.u2bgitem-nm{display:block;font-size:16px;font-weight:700;color:var(--sub);}
.u2bgitem-on .u2bgitem-nm{color:var(--ink);}
.u2fontlist{display:grid;gap:8px;}
.u2fontitem{display:flex;align-items:baseline;gap:10px;text-align:left;width:100%;
  border:2px solid var(--line2);border-radius:var(--r-box);padding:11px 13px;background:var(--paper);}
.u2fontitem-on{border-color:var(--ink);background:color-mix(in srgb,var(--acc) 30%,var(--paper));}
.u2fontitem-nm{font-size:19px;font-weight:800;}
.u2fontitem-hint{color:var(--faint);font-size:15px;margin-left:auto;flex:0 0 auto;}

/* 설정·창 안에도 고른 글씨를 이어 쓴다 (설명 줄만 프리텐다드) */
.u2set b,.u2set .rt,.u2btns button,.u2seg-b,.u2keys button,.u2pop-h b,.u2more,.u2animb{
  font-family:var(--ff),var(--ffui),var(--sys);}
.u2set small,.u2fld label,.u2sheet-in p{font-family:var(--ffui),var(--sys);}

.u2view{display:none;} .u2view-on{display:block;}
/* ⛔ 따로 정하지 않은 칸들의 **바닥값**. 위 .u2chk-add 주석과 같은 까닭이다(zoom 0.9 × 18 = 16). */
input:not([type=checkbox]):not([type=radio]), textarea, select{font-size:18px;}

/* ── 손가락이 닿는 자리 ─────────────────────────────────
   폰 점검(2026-09-09)에서 44px 이 안 되는 단추가 여럿 나왔다. 제일 작은 것이
   휴지통 29×29 · 「답한 것」 38×16 이었다.
   ⛔ **보이는 크기는 안 키운다.** 오늘 아래 막대를 최소로 해 두었고, 화면이 뚱뚱해지면
      그 손질이 도로 헛것이 된다. 대신 ::after 로 **닿는 자리만** 넓힌다.
   ⛔ 알약(.chip)은 뺐다 — 7px 사이로 촘촘히 붙어 있어서 넓히면 옆 알약을 가로챈다. */
#ckTrash, .u2tap, .u2findbtn, .u2mini, .u2gear, #monPrev, #monNext, .u2snd,
.u2animb, .u2tab{position:relative;}
#ckTrash::after, .u2findbtn::after, .u2mini::after, .u2gear::after,
#monPrev::after, #monNext::after, .u2snd::after,
.u2animb::after{content:'';position:absolute;inset:-8px -4px;}
/* ⛔ 아래 막대는 **막대 안에서만** 넓힌다. 위로 삐져나가면 그 자리에 있는 본문 줄을
   눈에 안 보이는 판이 덮어 **안 눌리게** 된다.
   ⚑ 막대를 66px 로 키운 뒤로는 단추가 이미 막대를 꽉 채워서(height:100%) 더 넓힐 것이 없다. */
.u2tab::after{content:'';position:absolute;inset:0;}
/* 「답한 것」처럼 글자만 있는 것은 위아래로 더 넓게 */
.u2head .u2tap::after{content:'';position:absolute;inset:-14px -10px;}
/* ⛔ 아래 막대 바로 위에 뜬다. 앞서 120px 은 막대가 68px 이던 때의 값이라,
   오늘 막대를 42px 로 줄이고 나니 **혼자 너무 높이** 떠 있었다
   (사장님 지적 2026-09-09 : 「입력했을떄 토스트창 너무 위에있기때문에 좀 내려야해」). */
.u2toast{position:fixed;left:50%;bottom:calc(var(--navbase) + 10px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);border-radius:99px;padding:11px 20px;font-size:16px;font-weight:700;
  z-index:70;box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;}
.u2toast.on{opacity:1;pointer-events:auto;}
/* ⛔ **창이 열려 있으면 「예시로 채워 둔 화면이야 · 시작해볼까?」 띠를 감춘다** (사장님 2026-09-15 실결제 시험).
   띠(70)가 창(65) 위에 떠서 이용권 창의 「카드로 내기」를 덮었다. 다른 알림(지웠어 등)은 그대로 창 위에 뜬다. */
body:has(.u2pop-on) .u2toast:has(#goStart){opacity:0;pointer-events:none;}
/* 🔴 **app.css 의 #toast 가 이 규칙을 이기고 있었다** (사장님 2026-09-10 : 「시작해볼까 눌러도
   작동을 안해」 · 「하루 두 끼 상자하고 겹쳐보여」). 둘 다 **한 가지 원인**이다.
   app.css 1460줄의 #toast 는 **아이디**라서 .u2toast.on(반 두 개)로는 못 이긴다. 그래서
     · pointer-events:none  → 보이는데 손가락이 통과한다 (눌러도 아무 일이 없었다)
     · bottom:104px         → 우리가 잡은 66px 이 무시되고 그만큼 높이 떠서 밥값 상자를 덮었다
   ⛔ ui2 머리말의 「짧은 이름은 u2 를 붙인다」는 **아이디에는 안 통한다.** 아이디가 같으면
      반 이름을 아무리 달리 지어도 진다. 이길 수 있게 아이디를 같이 적는다.
   ⛔ 이 앱은 app.css 를 같이 읽는다 — 지우면 옛 화면이 깨진다. 여기서 덮어쓰는 것이 맞다. */
#toast.u2toast{position:fixed;left:50%;
  bottom:calc(var(--navbase) + 10px);
  transform:translateX(-50%);border-radius:99px;padding:11px 20px;font-size:16px;
  /* 🔴 **긴 글은 줄을 바꾼다** (사장님 2026-09-21 : 「내용이 길어질때 글씨가 잘려보이고있어」).
     앞서는 한 줄로 못 박아 두었다 — 접히면 계산기·＋ 단추와 겹친다는 까닭이었다. 그런데 이 상자는
     flex 라 글이 **이름 없는 칸**이 되어 ellipsis 가 안 먹고, 가운데 맞춤이라 **양쪽이 다 잘렸다** :
     「…마 대출이자 · 멈춰 뒀어 · 고정 탭 맨 아래에서 다시 켤 수 있…」 — 앞뒤가 통째로 없어진다.
     ⛔ 단추와 겹칠 걱정은 이미 없다 — 알림이 떠 있는 동안 계산기는 비킨다(body.u2toasting, 아래).
     ⛔ 낱말 가운데서 끊지 않는다(keep-all). 둥글기도 99px → 22px — 한 줄일 땐 그대로 알약이고,
        두 줄이 되면 알약 꼴이 우스워진다. */
  white-space:normal;word-break:keep-all;line-height:1.4;border-radius:22px;
  pointer-events:none;}
#toast.u2toast>span{min-width:0;}
#toast.u2toast.on{opacity:1;pointer-events:auto;transform:translateX(-50%);}
/* 「시작해볼까?」 는 깜빡인다 — 둘러보는 내내 여기가 갈 길이라고 말해 준다 (사장님 2026-09-10).
   ⛔ 움직임을 꺼 둔 분에게는 안 깜빡인다. 그분들껜 어지럼증이 된다. */
@keyframes u2blink{0%,100%{opacity:1}50%{opacity:.3}}
#toast.u2toast .u2toast-b{animation:u2blink 1.1s ease-in-out infinite;}
/* ⛔ 「시작해볼까?」 가 떠 있는 동안은 **계산기 동그라미를 치운다.** 둘이 화면 아래 같은 자리를
   놓고 다퉈서, 알림창이 두 줄로 접히고 단추가 동그라미 밑으로 들어갔다 (2026-09-10 화면 확인).
   ⛔ 예시를 둘러보는 중에는 계산기를 쓸 일이 없다. 시작하시면 곧바로 돌아온다.
   ⛔ 알림창을 좁히는 쪽으로는 안 푼다 — 좁히면 글이 접혀서 읽기가 더 나빠진다. */
body.u2guide .u2calc{display:none;}
/* ⛔ **알림창이 떠 있는 동안은 계산기 동그라미를 치운다** (사장님 2026-09-11 :
   「토스트 팝업이랑 계산기랑 겹쳐보임」). 둘 다 화면 아래 오른쪽을 쓰는데, 알림이 길면
   오른쪽 끝까지 온다. 알림은 2.4초면 사라지고 그 사이 계산기를 쓸 일은 없다.
   ⛔ display:none 이 아니라 **opacity** 로 치운다 — 뚝 사라졌다 뚝 나타나면 눈에 거슬린다. */
body.u2toasting .u2calc{opacity:0;pointer-events:none;}
/* 서버가 숫자를 다시 세는 동안(카드 고치기 등) 돈 글자만 흐리게 — 옛 숫자라는 표시 (2026-09-17) */
.u2view b,.u2big,.u2r-am,.u2bal-v,.u2two-v{transition:opacity .2s;}
body.u2syncing .u2view b,body.u2syncing .u2big,body.u2syncing .u2r-am,
body.u2syncing .u2bal-v,body.u2syncing .u2two-v{opacity:.35;}
#toast.u2toast{max-width:calc(100vw - 24px);}
@media (prefers-reduced-motion:reduce){#toast.u2toast .u2toast-b{animation:none;}}
.u2toast{display:flex;align-items:center;gap:12px;justify-content:center;}
.u2toast-b{color:var(--acc);font-weight:800;font-size:16px;text-decoration:underline;
  text-underline-offset:3px;flex:0 0 auto;}
.u2loading{text-align:center;padding:60px 20px;color:var(--sub);font-size:17px;}
</style>

/* ⏸ 고정지출을 멈추거나 지울 때 (2026-09-17 · 「잠시멈춘것에서 제거할때 반응속도가 너무느려」)

    }));

          알약에 눌려 「10월에 통장에서 알아서 빠져」/「나가」처럼 엉뚱한 자리에서 끊긴다.
          알약 한 줄 · 곁말 한 줄로 **못 박는다.**
          ⛔ 금액은 절대 안 접힌다(nowrap). 접히면 「-216,」/「149원」이 되어 숫자가 아니게 된다. */
      +   '<div class="u2lock-h"><span class="u2chip">손대면 안 됨</span></div>'
      +   '<div class="u2lock-s">' + (+c.다음달.m.slice(5, 7)) + '월에 통장에서 알아서 빠져나가</div>'
      +   '<div class="u2lock-v u2big u2neg">-' + won(c.다음달.bank) + '원</div>'
       /* ⛔ 「이 돈을 또 빼나?」로 당황하지 않게 — 위 빵꾸·밥값에 **이미 넣어 셌다**고 적는다 (2026-09-15 A안) */
    +   (c.다음달고정 ? '<div class="u2lock-in">위 빵꾸랑 밥값에 <b>벌써 넣어서</b> 셌어 · 한 달 먼저 준비해 두자</div>' : '')
       /* 사장님이 직접 고르신 말이다 (2026-09-12) — 손대지 말 것. */
      +   '<div class="u2lock-m">지금 통장에 있어도 <b>절대로 쓰면 안 되는 돈</b>이야<br>'
      +     '여기 손대면 다음 달에 <b>빵꾸</b> 나</div>'
      +   '<div class="u2seemore"><span>눌러서 뭐가 빠지는지 보기</span>'
      +     '<svg><use href="#p-right"/></svg></div>'
      + '</div>' : '')

       /* 🩹 빵꾸면 **메우는 길**을 바로 밑에 둔다 (사장님 2026-09-15 : 「대비할수있는 방법도 같이 알려줘 · 당근·번개 팔기, 알바, 용돈 이런거」) */
    + ((c.이번달 && c.빵꾸 < 0) ? 메우는법(d, c) : '')
       /* 🔴 **「지금까지 모은 것」은 고정 탭으로 옮겼다** (사장님 2026-09-21 :
          「모으고 있는것 만 고정으로 이동하고 아무것도 옮기지마」).
          ⛔ 옮긴 것은 이 하나뿐이다. 나머지 상자는 있던 자리 그대로 둔다. */
       /* ⛔ 십일조·체크할 것·잘 쓰고 있어·칭찬은 **오늘 기준**으로 서버가 세어 준다.
          지나간 달·앞으로 올 달에 그대로 얹으면 그 달 것인 양 읽힌다. */
    + (c.이번달 ? tithe(d) + checkCard(d) + useCard(d)
      + '<div class="u2praise">'
      +   '<div class="u2praise-a">' + V.칭찬(+M.slice(5, 7)) + ' <span class="u2emo">💛</span></div>'
      +   '<div class="u2praise-b">' + V.칭찬밑((d.noSpend || {}).run) + '</div>'
      + '</div>'
      : tithePast(d)
      + '<div class="u2sub" style="text-align:center;padding:22px 6px;line-height:1.7">'
        + (c.지난달 ? '지나간 달이야. <b>적은 것</b>과 <b>그때 나간 것</b>만 보여줄게.'
          : '앞으로 올 달이야. <b>나갈 돈</b>만 미리 보여줄게.<br>'
            + '하루 밥값이랑 도장은 그 달이 와야 알 수 있어.')
        + '</div>');
}

/* ── 빵꾸 메우는 법 ──────────────────────────────────────
   ⛔ **겁주지 않는다.** 이 앱은 이미 무서운 사람에게 말을 건다 — 「큰일」이 아니라 「하나씩 해 보자」.
   ⛔ 지어내지 않는다. 팔 값은 손님이 「안 씀」에 적어 둔 값(use.sell)만 더한다. 없으면 어디서 팔지만 말한다.
   ⛔ 알바 셈은 **최저시급 × 8시간**으로만 어림한다. 해마다 바뀐다 — 새해에 이 수를 고칠 것. */
const 최저시급 = 10320;          // 2026년 최저시급
function 메우는법(d, c) {
  const 모자 = -c.빵꾸;
  const sell = ((d.use || {}).sell || []).filter((s) => s && s.name);
  const 팔값 = sell.reduce((a, s) => a + (Number(s.ask) || 0), 0);
  const 하루알바 = 최저시급 * 8;
  const 알바날 = Math.max(1, Math.ceil(모자 / 하루알바));
  return '<div class="u2title" style="margin-top:6px">빵꾸 메우는 법 <span class="u2emo">🩹</span></div>'
    + '<div class="u2card u2fill">'
    +   '<div class="u2sub" style="line-height:1.55"><b>' + won(모자) + '원</b>만 채우면 돼. 하나씩 해 보자.</div>'
    +   '<div class="u2fill-r"><span class="u2emo">🥕</span><div><b>안 쓰는 거 팔기</b><small>'
    +     (팔값 ? '안 쓴다고 한 것 ' + sell.length + '개 · 올리면 약 ' + won(팔값) + '원' : '당근 · 번개장터 · 한 달 넘게 안 쓴 것부터')
    +   '</small></div></div>'
    +   '<div class="u2fill-r"><span class="u2emo">⏱️</span><div><b>짧은 알바</b><small>하루 8시간이면 약 '
    +     won(하루알바) + '원 · ' + 알바날 + '일이면 다 메워져</small></div></div>'
    +   '<div class="u2fill-r"><span class="u2emo">💌</span><div><b>용돈 부탁</b><small>가족에게 솔직하게 말해 보기 · 부끄러운 일 아니야</small></div></div>'
    +   '<button class="u2go" data-fillin style="margin-top:12px">들어온 돈 적기</button>'
    +   '<div class="u2sub" style="margin-top:8px">들어온 돈을 적으면 빵꾸가 바로 줄어.</div>'
    + '</div>';
}

function foldBody(c) {
  const V = 말(c.버티기);
  const 목록 = [1, 2, 3, 6].concat([c.goal]).filter((g, i, a) => a.indexOf(g) === i).sort((a, b) => a - b);
  return '<div class="u2fold-box on">'
    +   row('지금 가진 돈', won(c.잔액) + '원')
       /* 🔴 **버틸 기간만큼 나갈 것을 통째로 뺀다** (사장님 2026-09-21 :
          「3달치 고정지출 나갈것을 빼고 계산해야되지않니」). 3개월을 버틸 거면 그 90일 동안
          올 카드 청구서 석 장과 고정지출을 다 빼야 남는 돈이 맞다.
          ⛔ 줄을 하나로 묶는다 — 석 달치를 낱낱이 펼치면 스무 줄이 넘는다. */
    +   (c.창셈
        ? row(c.goal + '개월(' + c.창일수 + '일) 동안 나갈 카드·고정지출', '－ ' + won(c.창나갈것) + '원')
        : row((+M.slice(5, 7)) + '월 말까지 은행 고정', '－ ' + won(c.은행) + '원')
       /* ⛔ 카드를 **한 장도 빠뜨리지 않는다.** 위 남는돈이 전부를 뺀 값이라,
          여기 한 장만 적으면 손님이 눈으로 더했을 때 답이 안 맞는다. */
        + c.카드.map((x) => row(md(x.d) + ' ' + esc(x.name) + ' 청구서',
            '－ ' + won(x.amt) + '원')).join('')
        + (c.다음달고정 ? row((+c.다음달.m.slice(5, 7)) + '월 고정지출 · 미리 떼어 둠', '－ ' + won(c.다음달고정) + '원') : ''))
    +   row('남는 돈', (c.창남는돈 < 0 ? '－' : '') + won(Math.abs(c.창남는돈)) + '원')
    +   row(c.버티기 ? c.goal + '개월(' + c.창일수 + '일)로 나누면'
          : (+M.slice(5, 7)) + '/' + c.말일 + '까지 ' + c.남은날 + '일로 나누면',
        '하루 ' + won(c.하루) + '원')
       /* 🔴 **밥값은 하루 몫 전부가 아니다** (사장님 2026-09-21). 하루 몫에는 차비·생필품·
          병원비가 다 들어 있다. 절반만 밥값으로 보고 두 끼로 나눈 것이 한 끼다.
          ⛔ 이 두 줄을 합치지 말 것 — 「왜 이 값이냐」에 답하는 자리다. */
    +   row('그중 밥값은 절반', '하루 ' + won(c.밥몫) + '원')
    +   row('두 끼니까 한 끼에', won(c.한끼셈) + '원')
       /* 🔴 한 끼 1만원 상한 (사장님 2026-09-23) — 걸렸을 때만 두 줄을 더 적는다. 셈은 calc.js */
    +   (c.한끼셈 > c.끼상한
        ? row('한 끼는 최대 ' + won(c.끼상한) + '원까지만', '하루 밥값 ' + won(c.하루밥값) + '원')
          + row('남는 밥값 몫은 비상금으로', won(c.밥여유) + '원')
        : '')
    +   '<small class="u2warn">' + V.조심 + '</small>'
    + '</div>'
    + (c.버티기
       /* 🔴 **왜 3개월이 기본인지 한 줄로 적는다** (사장님 2026-09-21 : 「고정수입이 생기려면
          취업이나 알바를 해야 돈이 들어오는데 일을 해야 한달뒤에 돈이 나오는거니까」).
          일 구하는 데 한두 달, 들어가서 첫 월급까지 또 한 달 — 돈이 들어오는 건 빨라야 3개월 뒤다.
          ⛔ 한 줄뿐이다. 이 줄을 늘리지 말 것. */
      ? '<div class="u2sub" style="margin:16px 0 8px">몇 달 버틸까 · 일 구하고 첫 월급까지 3개월은 봐야 해</div>'
        + '<div class="chips">' + 목록.map((g) =>
            '<button class="chip' + (g === c.goal ? ' on' : '') + '" data-goal="' + g + '">'
            + g + '개월</button>').join('') + '</div>'
      : '<div class="u2sub" style="margin-top:14px">다음 달엔 들어오는 돈이 있으니'
        + ' 이 달 말까지로 나눠. 버티는 중이면 설정에서 버티기 모드를 켜.</div>');
}

/* ── 십일조 ─────────────────────────────────────────────
   지금 앱과 같은 값(d.tithe). ⛔ 「낼 것」을 앞세운다. */
/* ⛔ 세는 창의 첫날은 weekFrom 이 아니라 **그 하루 앞(지난 주일)** 이다.
   서버(api/ledger.js)는 「지난 주일 06:50 ~ 이번 주일 06:50」으로 센다. weekFrom 은
   그 다음 날이라, 그대로 적으면 지난 주일에 들어온 돈이 창 밖에 있는 것처럼 보인다. */
const 전날 = (iso) => (iso
  ? new Date(Date.parse(iso + 'T00:00:00Z') - 86400e3).toISOString().slice(0, 10) : '');

/* 지나간 달에는 **「낼 것」이 아니라 「그 달에 낸 것」**을 보여준다
   (사장님 2026-09-11 : 「지난달에 십일조 내역이 안보임」).
   ⛔ 위 tithe(d) 를 지난 달에 그대로 쓰면 안 된다 — d.tithe 는 **오늘 기준**으로 서버가
      센 값이라, 8월 화면에 얹으면 「8월에 이만큼 남았다」는 거짓말이 된다.
   ⛔ 그래서 그 달 내역에서 **분류가 「십일조」인 줄만** 센다. 헌금 전부가 아니다
      (주정헌금·특별헌금은 다른 줄이다).
   ⛔ 한 줄도 없으면 칸을 아예 안 그린다. 「0원」이라고 적어 두면 안 낸 달을 나무라는 것처럼 읽힌다. */
function tithePast(d) {
  if (((d.cfg || {}).titheOn) === false) return '';
  const 줄 = (d.tx || []).filter((t) => t.cat === '십일조');
  if (!줄.length) return '';
  const 합 = 줄.reduce((a, t) => a + (Number(t.amt) || 0), 0);
  return '<div class="u2card">'
    + '<div class="u2head"><b style="font-size:18px">' + (+M.slice(5, 7)) + '월에 낸 십일조</b>'
    +   '<span class="u2big" style="font-size:20px">' + won(합) + '원</span></div>'
    + 줄.map((t) => '<div class="u2r"><span class="u2r-day">' + md(t.d) + '</span>'
        + '<span class="u2r-nm">' + esc(t.memo || '십일조') + '</span>'
        + '<span class="u2r-am">' + won(t.amt) + '</span></div>').join('')
    + '</div>';
}

function tithe(d) {
  if (((d.cfg || {}).titheOn) === false) return '';
  const t = d.tithe || {};
  if (!t.since && !t.monthPaid && !t.monthIncome && !t.left && !t.nextSince && !(t.offer || []).length) return '';
  const 적어둔 = t.planned || 0;
  const 더할것 = Math.max(0, (t.left || 0) - 적어둔);
  const 헌금 = t.offer || [];
  const 헌금합 = 헌금.reduce((a, x) => a + (Number(x.amt) || 0), 0);
  const md2 = (iso) => (iso ? (+iso.slice(5, 7)) + '월 ' + (+iso.slice(8, 10)) + '일' : '');
  return '<div class="u2card">'
    + '<div class="u2head"><b style="font-size:18px">십일조</b>'
    +   ((t.left || 0) <= 0 ? '<span class="u2chip">다 냈어요</span>' : '') + '</div>'
    + '<div class="u2sub">' + (t.paidAt ? md2(t.paidAt) + '에 내셨어요.'
        : '지난 주일부터 들어온 돈이 ' + won(t.since) + '원이야. '
          + md2(t.payOn) + '에 내면 돼.') + '</div>'
    + (더할것 ? '<div class="u2tithe-v">' + won(더할것) + '원</div>' : '')
    + (적어둔 ? '<div class="u2sub">' + won(적어둔) + '원은 이미 적어 두셨어요</div>' : '')
       /* 주일 6:50 뒤에 들어온 돈이 **어디로 갔는지** 카드에서 바로 말한다 (사장님 2026-09-13 :
          「수입이 있는데 십일조 항목에 반영이 안되고있어」). 안 말하면 빠진 것으로 보인다. */
    + (t.nextSince ? '<div class="u2sub" style="margin-top:6px">주일 아침 6:50 뒤에 들어온 '
        + won(t.nextSince) + '원은 ' + md2(t.nextOn) + ' 몫이야 · 그때 '
        + won(Math.floor(t.nextSince / 10)) + '원</div>' : '')
       /* ⛔ 「주정헌금 10,000원도 같이 적어 둘게」 줄은 뺐다 (사장님 2026-09-14 : 「이글은 안써도돼」).
          같이 적히는 것은 적기 창의 알약이 이미 보여준다. */
    + '<div class="u2tithe-btns">'
    +   '<button class="ghost" data-tithe="list">내역</button>'
    +   '<button class="go" data-tithe="pay"' + (더할것 || 헌금합 ? '' : ' disabled') + '>'
    +     (더할것 ? won(더할것) + '원 적기' : (헌금합 ? (헌금.length > 1 ? '헌금' : esc(헌금[0].name)) + ' ' + won(헌금합) + '원 적기' : '낼 것 없어'))
    +   '</button>'
    + '</div></div>';
}

function checkCard(d) {
  const all = Array.isArray(d.checks) ? d.checks : [];
  const 안한것 = all.filter((c) => !c.d), 한것 = all.filter((c) => c.d);
  const 줄 = 안한것.concat(한것);
  return '<div class="u2card u2chk">'
    + '<div class="u2head"><b style="font-size:18px">돈에 관련된 메모할 것</b>'
    +   '<span class="u2sub">' + (안한것.length ? 안한것.length + '개 남음'
          : (한것.length ? '다 하셨어요' : '')) + '</span>'
    +   '<button class="u2trash" id="ckTrash" aria-label="휴지통">'
    +     '<svg><use href="#p-trash"/></svg>'
    +     (trash().length ? '<i>' + trash().length + '</i>' : '') + '</button></div>'
    + (줄.length ? 줄.map((c) => '<div class="u2chk-r' + (c.d ? ' done' : '') + '">'
        + '<button class="u2chk-b" data-ckt="' + c.id + '" aria-label="체크">'
        + '<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7.5" fill="none"'
        + ' stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
        + '<span class="u2chk-t">' + esc(c.t) + '</span>'
        + '<button class="u2chk-x" data-ckd="' + c.id + '" aria-label="지우기">✕</button>'
        + '</div>').join('')
      : '<div class="u2empty">아직 없어. 아래에 적어 둬</div>')
    + '<div class="u2chk-add"><input id="ckNew" maxlength="60" placeholder="적어 둘 것">'
    +   '<button id="ckAdd">＋</button></div>'
    + '</div>';
}

/* ── 버티기 ─────────────────────────────────────────────── */
/* 내역을 **들어온 것 / 나간 것**으로 갈라 본다 (사장님 2026-09-11 :
   「입금 출금을 나눠서 볼 수 있도록 알약탭 필요」).
   ⛔ 화면 밖에 담아 둔다. render() 가 칸을 다시 그려도 고르신 것이 살아 있어야 한다.
   ⛔ 옮김(mv)은 **나간 것에 안 넣는다.** 저축·카드값 인출은 쓴 돈이 아니라 자리만 바꾼 것이라,
      나간 것에 섞으면 「이 달에 이만큼 썼다」가 뻥튀기된다. 따로 「옮긴 것」으로 본다. */
let txFilter = 'all';
function viewSurv(d, c) {
  const V = 말(c.버티기);
  const 전부 = (d.tx || []);

  /* ⛔ 오른쪽 큰 수는 **총액**이다. 적어 두신 총액이 없으면 **다달이 × 개월**로 짓는다 (교차검증 2026-09-22).

  const 총액 = (f) => {
    const t = f.inst && Number(String(f.inst.total).replace(/[^d]/g, ''));
    if (t > 0) return t;

    return n ? (Number(f.amt) || 0) * n : (Number(f.amt) || 0);

      +     ' · 다달이 ' + won(Number(f.amt) || 0) + '원'
      +     (할부개월(f) ? ' × ' + 할부개월(f) + '개월' : '') + '</em></span>'

/* 한 줄을 이름과 금액으로 가른다 — 마지막 숫자가 금액이다.
   ⛔ 역슬래시를 안 쓴다. 숫자는 [0-9] 로 적는다(이 자리에서 두 번 새어 파서가 죽었다). */
function 읽기(raw) {
  const t = String(raw || '').trim();
  const ms = [...t.matchAll(/[0-9][0-9,]*/g)];
  if (!ms.length) return null;
  const last = ms[ms.length - 1];
  const amt = Number(last[0].replace(/,/g, '')) || 0;
  if (!amt) return null;
  const name = (t.slice(0, last.index) + t.slice(last.index + last[0].length))
    .replace(/원[ ]*$/, '').replace(/[ ]+/g, ' ').trim();
  return { name, amt };
}

/* 「카드로」인가 「현금으로」인가 — 받침을 보고 고른다.
   ⛔ 손님이 지은 이름이 들어오는 자리라 하나로 못 박을 수 없다. 「카드으로」는 남의 글처럼 읽힌다. */

/* 📱 **뒤로가기 = 맨 위 창 닫기** (2026-09-19 안드로이드 앱 점검 : 창을 연 채 뒤로를 누르면 앱이 통째로 꺼졌다).

   ⛔ 창을 닫는 길이 여럿이다(✕ · 바깥 누르기 · 코드가 el.remove()). 그래서 close 에 걸지 않고

/* 🔴 창이 떠 있는 동안 뒤 화면을 세워 둔다 (사장님 2026-09-21 · 위 body.u2popping 주석).
   ⛔ 창을 여닫는 길이 여럿이다 — pop()·뒤로가기(popstate)·el.remove(). 그래서 **부르는 자리마다
      켜고 끄지 않고**, 지금 창이 있나 없나를 보고 맞춘다. 아래 MutationObserver 가 같이 부른다. */
let 잠근자리 = null;
function 창잠금() {
  const 창있나 = !!document.querySelector('.u2pop');
  if (창있나 === (잠근자리 !== null)) return;          // 바뀐 게 없으면 손대지 않는다

    document.body.classList.remove('u2popping');

function pop(title, html, after) {
