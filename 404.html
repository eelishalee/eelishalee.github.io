        if (it.every === 'w' && 같이건드림) 보낼것.withTithe = 같이;
        const 부터 = ($('#fxFrom', el).value || '');
        if (/^\d{4}-\d{2}$/.test(부터)) 보낼것.from = 부터;
        /* 몇 개월 할부인가.
           ⛔ **옛 값 위에 얹는다.** 서버는 inst 를 통째로 갈아 끼우기 때문에, 개월수만
              보내면 총액·이율·첫 회 값이 조용히 날아간다 (사장님이 A 에서 넣어 두신 값이다).
           ⛔ 종류가 할부가 아니면 손대지 않는다 — 칸이 화면에 없으니 값도 없는 것이 맞다. */
        if (type === 'inst') {
          const 개월 = Math.min(60, Math.max(0, Number(($('#fxInstM', el).value || '').replace(/[^\d]/g, '')) || 0));
          /* 🔴 **「얼마」를 고치셨으면 그 값이 이긴다** (사장님 2026-09-16 : 「제습기 할부 총액 바꿨는데 반영이 어디에도 안돼」).
             A 에서 넣어 둔 이율·총액이 남아 있으면 서버가 회차마다 이율로 다시 세서(amtFor) **고친 금액을 무시했다** —
             고정 탭만 49,000 · 장부·카드값은 107,060. 이 창엔 이율 칸이 없으니 고칠 길도 없었다.
             → 금액을 바꾸면 이율 셈을 걷고(rate 0) 총액을 「매달 × 개월」로 맞춘다. 첫 회(first)는 그대로 둔다.
             ⛔ 금액을 안 건드렸으면 이율 셈은 그대로 산다. */
          const 옛inst = it.inst || {};
          if (이율셈 && amt !== 보인금액) {
            const n = 개월 >= 2 ? 개월 : (Number(옛inst.months) || 0);
            보낼것.inst = Object.assign({}, 옛inst, { rate: 0, months: n, total: n >= 2 ? amt * n : 옛inst.total });
          }
          if (개월 >= 2) {
            보낼것.inst = Object.assign({}, 보낼것.inst || it.inst || {}, { months: 개월 });
            /* 「언제까지」를 비워 두셨으면 개월수로 채운다 — 그래야 목록에 「11월까지 2번 남음」이
               뜨고, 다 낸 뒤에 저절로 멈춘다. ⛔ 적어 두신 끝달은 건드리지 않는다. */
            const 시작 = 보낼것.from || it.from || '';
            if (!보낼것.to && /^\d{4}-\d{2}$/.test(시작)) {
              const dt = new Date(+시작.slice(0, 4), +시작.slice(5, 7) - 1 + (개월 - 1), 1);
              보낼것.to = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
            }
          }
        }
        /* 대출 — ⛔ 옛 값 위에 얹는다(할부와 같은 까닭). 만기를 적고 「언제까지」가 비었으면 만기 달로 채운다 —
           만기가 지나면 이자가 저절로 멈춘다. ⛔ 적어 두신 끝달은 건드리지 않는다. */
        if (type === 'loan') {
          const 끝날 = ($('#fxLE', el).value || '');
          보낼것.loan = Object.assign({}, it.loan || {}, {
            principal: Number(($('#fxLP', el).value || '').replace(/[^\d]/g, '')) || 0,
            rate: ($('#fxLR', el).value || '').replace(/[^\d.]/g, ''),
            start: ($('#fxLS', el).value || ''), end: 끝날, way: lway });
          /* ⛔ 만기가 이미 지난 달이면 채우지 않는다 — 그러면 저장하는 순간 대출이 끝난 것으로 꺼진다(교차검증) */
          if (!보낼것.to && /^\d{4}-\d{2}-\d{2}$/.test(끝날) && 끝날.slice(0, 7) >= String(D.today || nowMonth()).slice(0, 7)) {
            보낼것.to = 끝날.slice(0, 7);
          }
        }
        /* ⚡ 고칠 때는 고정 탭 줄을 먼저 바꿔 그린다 — 장부·카드값·빵꾸는 서버 답이 오면 맞춰진다 */
        되돌림 = 새것 ? null : 먼저그리기((d) => {
          d.fixed = (d.fixed || []).map((x) => (x.id === it.id
            ? Object.assign({}, x, 보낼것, (x.cur != null && !(Number((보낼것.inst || x.inst || {}).rate) > 0))
              ? { amt, cur: amt, rest: undefined } : { amt }) : x));
          /* 이 달 한 번 치가 정해진 경우만(이율 셈이 아니면) 적힌 줄·청구서·예정까지 옮긴다 */
          if (!(Number((보낼것.inst || it.inst || {}).rate) > 0)) 고정효과(d, it.id, amt, { 옛: it.name, 새: name });
        });
        /* ⚡ 새로 넣는 것도 고정 탭에 먼저 올린다 (2026-09-17) · 이번 달 남은 날이면 은행 예정에도 */
        const 임시번호 = 'tmp' + Date.now();
        if (새것) {
          되돌림 = 먼저그리기((d) => {
            /* ⛔ 임시 번호는 **맨 뒤에** 얹는다 — 보낼것.id(새것이면 undefined)가 덮어 번호 없는 줄이 되었다 */
            const 임시 = Object.assign({ from: nowMonth() }, 보낼것, { id: 임시번호 });
            d.fixed = (d.fixed || []).concat(임시);
            if (type !== 'inst' && type !== 'loan' && !(보낼것.from > String(d.today || '').slice(0, 7))) 고정끄기효과(d, 임시, false);
          });
        }
        toast(새것 ? '넣었어' : '고쳤어');
        /* ⛔ 막 넣은 것(임시 번호)을 고치면 진짜 번호를 기다렸다 보낸다 — 임시 번호로 보내면 서버가 못 찾고 「고쳤어」만 남는다 (교차검증 2026-09-18) */
        if (!새것 && /^tmp/.test(String(it.id || ''))) {
          const 진짜 = await 진짜고정번호(it);
          if (!진짜) { if (되돌림) 되돌림(); toast('넣는 중이 끝나지 않았어 · 다시 고쳐 줘'); return; }
          보낼것.id = 진짜;
        }
        const 앞번호 = new Set((D.fixed || []).map((x) => x.id));
        const 감 = api('fixed', { body: { op: 새것 ? 'add' : 'edit', item: 보낼것, viewM: M } });
        /* 새 번호 찾기 — 이 답에서 **처음 보는 번호** 가운데 이름·금액이 같은 것.
           ⛔ 같은 이름을 잇달아 넣으면(「test」 85원 → 121원) 앞 것의 진짜 번호도 새로 보이므로,
              이미 다른 임시 번호에 짝지어진 번호는 뺀다 (교차검증 2026-09-18) */
        if (새것) 넣는고정[임시번호] = 감.then((j) => {
          const 짝지은 = new Set(Object.values(풀린번호));
          const 후보 = (j.fixed || []).filter((x) => !앞번호.has(x.id) && !짝지은.has(x.id) && x.name === name);
          const 딱 = 후보.filter((x) => Number(x.amt) === amt);
          const id = ((딱.length ? 딱 : 후보).slice(-1)[0] || {}).id || null;
          if (id) 풀린번호[임시번호] = id;
          return id;
        }, () => null);
        D = await 감;
        M = D.m || M; render();
      } catch (e) {
        if (되돌림) 되돌림();
        toast(e.message);
        /* ⛔ **새로 넣는 것만** 막힌다. 고치는 것은 이용권 없이도 된다(서버도 그렇다). */
        if (e.needPay) setTimeout(sheetPay, 300);
      }
    };
  });
}

/* ══ 카드 만들고 고치기 ═══════════════════════════════════
   ⛔ 카드는 cfg.cards 한 곳에 산다. 마감일·결제일이 있어야 청구서 창이 서로 갈린다. */
/* ══ 처음 설정 ═══════════════════════════════════════════
   사장님 2026-09-11 : 「맨처음 고객이 적을 곳이 필요 기존내용이라던지 받는 가이드가
   있어야할듯, 롯데카드 무ㅓ 이런거 사용중인 카드와 결제일, 고정지출 이런거, 교통비,
   또 받아놔야 하는정보입력폼이 맨 처음 초기에 필요」

   ⛔ **세 가지만 묻는다.** ① 통장에 얼마 ② 쓰는 카드 ③ 매달 나가는 것.
      이 셋이 없으면 첫 화면이 0원짜리 빈 껍데기라, 손님은 「이게 뭘 해 주는 건데」로 끝난다.
      더 묻고 싶은 것이 많아도 참는다 — 처음 만난 사람에게 설문지를 내밀면 그냥 나간다.
   ⛔ **한 걸음마다 그 자리에서 저장한다.** 마지막에 몰아서 저장하면 중간에 창을 닫으신 분은
      적은 것이 통째로 날아간다.
   ⛔ 언제든 건너뛴다. 나중에 설정 → 「처음 설정」에서 다시 연다.
   ⛔ **새 서버 길을 만들지 않는다** — cfg(hold·cards)와 fixed 는 이미 있는 길이다.
   ⛔ 교통비는 여기서 따로 안 묻는다. 매달 같은 값이 아니라 그때그때 쓰는 돈이라
      고정지출로 박아 두면 오히려 틀어진다. 분류에 이미 들어 있고, 적기 칸에서 고르면 된다. */
const SETUPKEY = 'u2setupdone';
const 설정했나 = () => { try { return localStorage.getItem(SETUPKEY) === '1'; } catch (e) { return false; } };
const 설정했다 = () => { try { localStorage.setItem(SETUPKEY, '1'); } catch (e) {} };

/* 「가지고 있는 돈」을 언제 넣으셨나 — 오늘이면 「오늘 넣음」, 아니면 날짜 */
function 언제넣음(t) {
  const d = new Date(Number(t) || 0);
  if (!(Number(t) > 0)) return '';
  const iso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const 오늘 = (D && D.today) || new Date().toISOString().slice(0, 10);
  return iso === 오늘 ? '오늘 넣음' : md(iso) + ' 넣음';
}

function sheetSetup() {
  /* 🔴 **묻기 전에 왜 묻는지부터 말한다** (사장님 2026-09-12 : 「처음설정 더 친절하게 묻자
     힘든사람들이니까」).
     이 앱에 처음 오시는 분은 **돈이 모자란 채로** 오신다. 그런 분께 아무 말 없이
     「통장에 얼마 있어?」부터 들이밀면 그건 묻는 게 아니라 **캐묻는 것**이다.
     ⛔ 첫 화면에서 딱 두 가지만 한다 — ① 애썼다고 말해 주기 ② 얼마나 걸리는지 알려 주기.
        「얼마 버냐」·「빚이 얼마냐」 같은 건 **묻지도 않는다.**
     ⛔ 그래도 **길게 늘어놓지 않는다.** 위로가 길면 그것도 짐이 된다. 세 줄 안에 끝낸다. */
  let 걸음 = 0;
  /* 🔴 **pay·also 를 들고 다닌다** (2026-09-15 · 사장님 : 「갑자기 다음달 카드금액이 줄어들어서 식비 계산 착오됨」 705,518 → 54,022).
     이 창은 이름·마감일·결제일만 묻는데, 저장할 때 pay 를 **카드 이름으로 덮어써서**
     「카드」로 적어 온 651,496원과 「카드」로 빠지는 고정지출 20,900원이 롯데카드에서 떨어져 나갔다.
     ⛔ 묻지 않은 것은 건드리지 않는다. 옛 값을 그대로 실어 보낸다. */
  const 카드 = ((D.cfg || {}).cards || []).filter((c) => c && c.name)
    .map((c) => ({ name: c.name, close: c.close || '', payday: c.payday || '',
      pay: c.pay || '', also: Array.isArray(c.also) ? c.also.slice() : null, 종류: '신용', 옛이름: c.name }));
  /* ⛔ 마감일·결제일을 **미리 채워 두지 않는다** (사장님 2026-09-11 : 「카드 등록시 무조건
     마감일과 결제일을 받아」). 26·10 은 우리가 지어낸 날이라, 그대로 두시면 청구서가
     통째로 엉뚱한 날에 잡힌다. 빈 칸으로 두고 반드시 물어본다. */
  if (!카드.length) 카드.push({ name: '', close: '', payday: '', 종류: '신용' });
  const 고정 = [{ name: '', amt: '', day: '' }];
  /* 🔴 **지금 화면의 잔액**을 띄운다 — 넣어 둔 사진값이 아니다 (2026-09-15 · 사장님 화면 : 잔액 439,438 인데 이 칸엔 453,244).
     사진값을 띄워 두면 「다음」 한 번에 **그 뒤로 쓴 13,806원이 없던 일**이 된다(저장이 시각을 새로 찍는다).
     ⛔ 안 고치고 「다음」을 누르면 **저장하지 않는다.** 같은 수를 다시 찍어도 쓴 돈이 지워진다. */
  const 통장0 = (() => {
    const 사진값 = Number(((D.cfg || {}).hold || {}).have) || 0;
    /* ⛔ **이번 달을 보고 있을 때만** 화면 잔액을 쓴다 (교차검증 2026-09-15). 8월을 넘겨 보다가 열면 D 는 8월 장부라
       잔액이 8월 말 값이 되고, 그걸 오늘 잔액으로 찍으면 9월에 적은 것이 잔액에서 빠진다. 다른 달이면 사진값을 띄운다
       (안 고치고 넘기면 저장도 안 한다). */
    try { const c0 = calc(D); return c0.이번달 ? Math.max(0, Math.round(Number(c0.잔액) || 0)) : 사진값; }
    catch (e) { return 사진값; }
  })();
  let 통장 = 통장0;
  let 닫기 = null;

  /* ⛔ **되돌아갈 길을 둔다** (사장님 2026-09-12 : 「처음설정 이전으로 가기 되게 해주고」).
     걸음이 셋이면 손님은 반드시 한 번은 「아까 그거 잘못 적었는데」가 된다.
     그때 되돌아갈 길이 없으면 창을 닫아 버리고, 그러면 처음부터 다시다.
     ⛔ 인사 화면(걸음 0)에는 안 붙인다 — 그 앞에는 갈 곳이 없다.
     ⛔ 되돌아가도 **앞서 저장한 것은 그대로 둔다.** 걸음마다 그 자리에서 저장하는 까닭이
        「중간에 닫아도 안 날아가게」인데, 뒤로 갔다고 지우면 그 뜻이 무너진다. */
  const 머리 = (n, t, s) => ''
    + (n > 1 ? '<button class="u2sp-back" data-sp="back">‹ 이전</button>' : '')
    + '<div class="u2sp-h">'
    + (n ? '<span>' + n + ' / 3</span>' : '')
    + '<b>' + t + '</b><small>' + s + '</small></div>';
  /* ⛔ 「건너뛰기」는 차가운 말이다 — **「이건 나중에」**. 안 적으셔도 괜찮다는 뜻이
     단추 글자에 그대로 있어야 한다. 못 적는 것이 부끄러운 일이 되면 안 된다. */
  const 아래 = (go, 끝) => '<div class="u2sp-btm">'
    + '<button class="u2sp-skip" data-sp="skip">' + (끝 ? '나중에 할게' : '이건 나중에') + '</button>'
    + '<button class="go" data-sp="go">' + go + '</button></div>';

  /* 🔴 **신용카드인지 체크카드인지 처음부터 고르게 한다** (사장님 2026-09-15 : 「처음에 고객에게 받을때부터
     신용카드인지 체크카드인지 탭이 있어야겠네」). 이름으로 짐작하면 「하나카드」가 신용인지 체크인지 모른다.
     · 신용카드 → 마감일·결제일을 받고 청구서를 만든다
     · 체크카드 → 날짜 칸이 없다. 결제수단 목록에만 넣는다(쓴 날 바로 빠진다) */
  const 카드칸 = () => 카드.map((c, i) =>
    '<div class="u2cd" data-ci="' + i + '">'
    + '<div class="chips u2cd-kind">'
    +   '<button type="button" class="chip' + (c.종류 !== '체크' ? ' on' : '') + '" data-ck="' + i + '" data-ckv="신용">신용카드</button>'
    +   '<button type="button" class="chip' + (c.종류 === '체크' ? ' on' : '') + '" data-ck="' + i + '" data-ckv="체크">체크카드</button></div>'
    + '<input class="u2cd-n" data-cf="name" maxlength="20" value="' + esc(c.name) + '" placeholder="'
    +   (c.종류 === '체크' ? '토스체크카드' : '롯데카드') + '">'
    + '<div class="u2cd-r">'
    +   (c.종류 === '체크'
        ? '<span class="u2cd-note">쓴 날 통장에서 바로 빠져 · 날짜는 안 적어도 돼</span>'
        : '<label>마감</label>'
          + '<input data-cf="close" inputmode="numeric" maxlength="2" placeholder="26" value="'
          +   esc(String(c.close || '')) + '"><span>일</span>'
          + '<label>결제</label>'
          + '<input data-cf="payday" inputmode="numeric" maxlength="2" placeholder="10" value="'
          +   esc(String(c.payday || '')) + '"><span>일</span>')
    +   (카드.length > 1 ? '<button class="u2cd-x" data-cdel="' + i + '">✕</button>' : '')

          앞서는 26·10 을 미리 넣어 두었는데, 그건 **우리가 지어낸 날**이라 손님이 그대로 두면

    +     (c.close || '') + '"><span>일</span>'

    +     (c.payday || '') + '"><span>일</span>'

      고른것.forEach((x) => 줄들.push({ tx: { id: 새번호(), d: 날, k: 'out', amt: String(x.amt),

function 십일조내역() {

async function api2(fn, r, body) {
  const res = await fetch('/api/' + fn + '?r=' + r, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,

  return j;
}

  if (돌아온번호) history.replaceState(null, '', location.pathname);   // 새로고침해도 또 안 묻게 걷는다
  const 주문번호 = 돌아온번호 || 결제표.읽기();
  let r = null;
  if (주문번호) {
    결제표.지우기();                                                     // 한 번만 묻는다 · 못 마쳤으면 아래 recover 가 뒤를 받친다
    const out = await api2('pay', 'complete', { paymentId: 주문번호 }).catch(() => null);
    if (out && out.ok && out.lic && out.lic.paid) r = { found: true, lic: out.lic };
  }
  if (!r && (주문번호 || (lic || {}).canWrite === false)) r = await api2('pay', 'recover').catch(() => null);
  return (r && r.found && r.lic && r.lic.paid) ? r.lic : null;
}

/* ══ 결제 시도 — 사장님만 ═══════════════════════════════

async function sheetTries() {

  const 줄 = st.rows || [];
  const 언제 = (v) => {
    if (!v) return '';
    const d = new Date(v);
    if (isNaN(d)) return String(v).slice(0, 16);
    /* 한국 시각으로 적는다 — 사장님이 포트원 화면과 맞대 보실 값이다 */
    const k = new Date(d.getTime() + 9 * 3600 * 1000).toISOString();
    return (+k.slice(5, 7)) + '/' + (+k.slice(8, 10)) + ' ' + k.slice(11, 16);
  };
  const 안받은것 = 줄.filter((x) => x.st !== '받음').length;
  const 그리기 = (줄들) => (줄들.length ? 줄들.map((x) => {

      +   '<span class="u2chip' + (받음 ? '' : ' u2chip-hot') + '">' + esc(x.st || '?') + '</span></div>'
      + (x.why ? '<div class="u2sub" style="margin-top:4px">' + esc(x.why) + '</div>' : '')
      + '<div class="u2trypid">' + esc(x.pid || '') + '</div>'
      + (받음 ? '' : '<button class="u2more" data-try="' + esc(x.pid || '') + '">지금 다시 확인</button>')
      + '</div>';
  }).join('') : '<div class="u2empty">아직 결제창을 띄운 사람이 없어</div>');

        const 주인 = cards.findIndex((k) => 카드가진이름(k).indexOf(v) >= 0);
        if (주인 === to) { 여는 = ''; 그리기링크(); return; }
        if (주인 >= 0 && cards[주인].name === v) { toast('카드 이름 그 자체라 떼어 낼 수 없어'); return; }
        /* ⛔ 한 이름은 **한 곳에만** 붙는다. 두 카드에 걸리면 한 장에 다 쏠린다. */
        cards.forEach((k) => { k.also = k.also.filter((x) => x !== v); if (k.pay === v) k.pay = k.name; });
        if (to >= 0) {
          if (카드가진이름(cards[to]).length >= 7) { toast('한 카드에 여섯 개까지 붙일 수 있어'); return; }
          cards[to].also.push(v);
        }
        b.disabled = true;
        try {
          await api('cfg', { body: { cfg: { cards } } });
          await load(M);
          여는 = ''; 그리기링크();
          toast(to >= 0 ? v + ' · ' + cards[to].name + ' 청구서로 셀게' : v + ' · 쓴 날 통장에서 바로 뺄게');
        } catch (e) { b.disabled = false; toast(e.message); }
      });
    };
    그리기링크();
    $('#ctPay', el).addEventListener('input', 그리기링크);

    /* ── 분류 ✕ ── (사장님 2026-09-15 : 「분류에도 결제수단처럼 ✕ 단추를 붙여」)
       ⛔ 목록에서만 뺀다. 이미 적어 둔 줄은 그 이름 그대로 남는다.
       ⛔ **「십일조」에는 ✕ 를 안 준다.** 십일조 칸·주일 셈이 이 이름 한 글자로 돈다(api/ledger.js 의 십일조줄).
          지우면 적기 칸에서 십일조를 고를 수 없어 십일조 셈이 멈춘다.
       ⛔ 글칸에 보이는 그대로 저장한다 — 화면과 저장이 다른 말을 하면 안 된다. */
    const 그리기분류 = () => ['out', 'in'].forEach((kind) => {
      const box = $(kind === 'out' ? '#ctOutX' : '#ctInX', el);
      const 글칸 = $(kind === 'out' ? '#ctOut' : '#ctIn', el);
      if (!box || !글칸) return;
      box.innerHTML = 쪼개기(글칸.value).map((v) => '<span class="u2cx">' + esc(v)
        + (v === '십일조' ? '' : '<button type="button" data-cxk="' + kind + '" data-cxv="' + esc(v)
          + '" aria-label="' + esc(v) + ' 지우기">✕</button>')
        + '</span>').join('');
      box.querySelectorAll('[data-cxv]').forEach((b) => b.onclick = async () => {
        const v = b.dataset.cxv, k = b.dataset.cxk;
        const out = 쪼개기($('#ctOut', el).value), inn = 쪼개기($('#ctIn', el).value);
        const 남길 = (k === 'out' ? out : inn).filter((x) => x !== v);
        if (!남길.length) { toast('분류는 하나는 있어야 해'); return; }
        /* ⚡ 칸에서 먼저 뺀다 (2026-09-17) — 저장은 뒤에서, 거절되면 되돌린다 */
        const 칸 = $(k === 'out' ? '#ctOut' : '#ctIn', el);
        const 옛글 = 칸.value, 옛고름 = addCat;
        칸.value = 남길.join(', ');
        if (addCat === v) addCat = null;
        그리기분류();
        toast(v + ' 지웠어');
        try {
          await 차례로(() => api('cfg', { body: { cfg: { cats: k === 'out' ? { out: 남길, in: inn } : { out, in: 남길 } } } }));
          await load(M);
        } catch (e) {
          칸.value = 옛글; addCat = 옛고름; 그리기분류();
          toast(e.message);
        }
      });
    });
    그리기분류();
    $('#ctOut', el).addEventListener('input', 그리기분류);
    $('#ctIn', el).addEventListener('input', 그리기분류);
    $('#ctSave', el).onclick = async () => {
      const out = 쪼개기($('#ctOut', el).value);
      const inn = 쪼개기($('#ctIn', el).value);
      const pays = 쪼개기($('#ctPay', el).value);
      if (!out.length || !inn.length || !pays.length) { toast('세 칸 다 하나씩은 있어야 해'); return; }
      close();
      /* ⚡ 화면 먼저 */
      /* ⛔ 고른 것이 사라진 이름일 수 있다 — 다시 그릴 때 첫째로 되돌린다 */
      const 옛고름 = [addCat, addPay];
      addCat = null; addPay = null;
      const 되돌림 = 먼저그리기((d) => { d.cfg = Object.assign({}, d.cfg, { cats: { out, in: inn }, pays }); });
      toast('바꿨어');
      try {
        await 차례로(() => api('cfg', { body: { cfg: { cats: { out, in: inn }, pays } } }));
        await load(M);
      } catch (e) { [addCat, addPay] = 옛고름; 되돌림(); toast(e.message); }
    };
  });
}

/* ── 찾기 ─────────────────────────────────────────────────
   ⛔ 서버가 **모든 달**을 훑는다(/api/ledger?r=search). 화면에 있는 이 달만 뒤지면
      「작년에 그거 얼마 줬지」를 못 찾는다 — 찾기를 만드는 까닭이 바로 그거다.
   ⛔ 치는 동안 계속 부르지 않는다. 260ms 쉬면 그때 한 번 묻는다. */
var 찾은것 = {};
function sheetFind() {
  let 늦기 = null, 마지막 = '';
  pop('찾기',
    '<div class="u2findbar">'
    +   '<svg viewBox="0 0 24 24" style="width:19px;height:19px;fill:none;stroke:currentColor;'
    +     'stroke-width:2.4;stroke-linecap:round;opacity:.5"><circle cx="11" cy="11" r="6.6"/>'
    +     '<path d="M16 16l4.4 4.4"/></svg>'
    +   '<input id="fq" placeholder="편의점 · 카드 · 식비" autocomplete="off">'
    + '</div>'
    + '<div id="fres"><div class="u2empty">찾을 말을 적어 봐<br>가게 이름 · 분류 · 결제수단으로 찾아</div></div>',
  (el) => {
    const inp = $('#fq', el), box = $('#fres', el);
    const 그리기 = (r) => {
      if (!r.rows.length) {
        box.innerHTML = '<div class="u2empty"><b>「' + esc(r.q) + '」 은 없어</b><br>다른 말로 찾아봐</div>';
        return;
      }
      box.innerHTML = '<div class="u2findsum"><span>모든 달에서 <b>' + r.total + '건</b></span>'
        + '<span>들어옴 ' + won(r.sum.in) + ' · 나감 ' + won(r.sum.out) + '</span></div>'
        + (r.more ? '<div class="u2sub" style="margin:0 2px 10px">너무 많아 최근 300건만 보여줄게</div>' : '')
        + r.rows.map((t) =>
            '<div class="u2r tap" data-tx="' + t.id + '"><span class="u2r-day">'
       /* 올해 것은 9/6 로, 지난 해 것만 해를 붙인다 — 찾기는 여러 해가 섞인다 */
            + (String(t.d).slice(0, 4) === String(new Date().getFullYear())
                ? md(t.d) : String(t.d).slice(2, 4) + '.' + md(t.d)) + '</span>'
            + '<span class="u2r-nm">' + esc(t.memo || t.cat || (t.k === 'in' ? '수입' : '지출')) + '</span>'
            + '<span class="u2r-am ' + (t.k === 'in' ? 'u2pos' : 'u2neg') + '">'
            + (t.k === 'in' ? '+' : '-') + won(t.amt) + '</span></div>').join('');
      /* 찾은 줄을 눌러 그 자리에서 고친다 — 찾아 놓고 못 고치면 반쪽이다 */
      box.querySelectorAll('[data-tx]').forEach((row) => row.onclick = () => {
        const t = (r.rows || []).find((x) => x.id === row.dataset.tx);
        if (t) sheetTx(t);
      });
    };
    const 묻기 = async () => {
      const q = inp.value.trim();
      마지막 = q;
      if (!q) { box.innerHTML = '<div class="u2empty">찾을 말을 적어 봐</div>'; return; }
      /* ⚡ 한 번 찾은 말은 바로 보여 준다 (쓰기가 나가면 버린다 · 쓰기판) */
      const 둔것 = 찾은것[q];
      if (둔것 && 둔것.판 === 쓰기판) { 그리기(둔것.j); return; }
      /* 찾는 동안 앞 결과를 지우지 않는다 — 화면이 깜빡이지 않게 흐리게만 */
      if (box.querySelector('[data-tx]')) box.style.opacity = '.5';
      else box.innerHTML = '<div class="u2empty">찾는 중…</div>';
      try {
        const 판 = 쓰기판;
        const j = await api('search', { q: 'q=' + encodeURIComponent(q) });
        찾은것[q] = { j, 판 };
        if (마지막 !== q) return;          // 더 친 뒤에 온 답은 버린다
        box.style.opacity = '';
        그리기(j);
      } catch (e) { box.style.opacity = ''; box.innerHTML = '<div class="u2empty">' + esc(e.message) + '</div>'; }
    };
    inp.oninput = () => { clearTimeout(늦기); 늦기 = setTimeout(묻기, 찾은것[inp.value.trim()] ? 0 : 260); };
    inp.onkeydown = (e) => { if (e.key === 'Enter') { clearTimeout(늦기); 묻기(); } };
    setTimeout(() => inp.focus(), 250);
  });
}

/* ── 폰에 놓아두기 (QR) ───────────────────────────────────
   ⛔ 이건 「있으면 좋은 것」이 아니라 **이 앱이 살아남는 길**이다.
      즐겨찾기에 있는 가계부는 사흘이면 잊힌다. 홈 화면에 아이콘이 있어야 매일 열고,
      매일 열어야 적는다.
   ⛔ QR 그림은 서버가 그린다(/api/ledger?r=qr). 여기서 만들지 않는다 —
      두 곳에서 만들면 주소가 갈린다. */
let 설치기회 = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); 설치기회 = e; });
const 설치됨 = () => (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true);
/* ⛔ 한 줄로 뭉쳐 두면 아무도 못 따라온다 (사장님 2026-09-09 : 「홈에 설치하는 가이드를
   더 자세히 쉽게」). 걸음마다 **어디를 누르는지**와 **뭐가 보이는지**를 같이 적는다.
   ⛔ 마지막 줄은 **막히는 자리**다. 카톡·인스타 안에서 연 화면에는 그 단추가 아예 없다 —
      이걸 안 적어 두면 「내 폰엔 그런 게 없는데」로 끝난다. */
const 안내 = {
  ios: '<div class="u2step"><i>1</i><span>화면 <b>맨 아래 가운데</b>에 있는 '
    + '<b>공유 단추</b>를 눌러 <em style="font-style:normal;color:var(--sub)">'
    + '(네모에서 화살표가 위로 나가는 그림)</em></span></div>'
    + '<div class="u2step"><i>2</i><span>뜬 목록을 <b>위로 쓸어 올려</b> '
    + '<b>홈 화면에 추가</b>를 찾아 눌러</span></div>'
    + '<div class="u2step"><i>3</i><span>오른쪽 위 <b>추가</b>를 누르면 끝. '
    + '홈 화면에 아이콘이 생겨</span></div>'
    + '<span class="u2note">공유 단추가 안 보이면 지금 <b>사파리가 아닌 곳</b>(카톡·인스타 안)에서 '
    + '연 거야. 오른쪽 위 <b>···</b> → <b>사파리로 열기</b> 를 먼저 눌러 줘.</span>',
  and: '<div class="u2step"><i>1</i><span>오른쪽 위 <b>점 세 개(⋮)</b>를 눌러</span></div>'
    + '<div class="u2step"><i>2</i><span><b>앱 설치</b>를 눌러 '
    + '<em style="font-style:normal;color:var(--sub)">(없으면 <b>홈 화면에 추가</b>)</em></span></div>'
    + '<div class="u2step"><i>3</i><span><b>설치</b>를 누르면 끝. 홈 화면에 아이콘이 생겨</span></div>'
    + '<span class="u2note">단추가 안 보이면 지금 <b>크롬이 아닌 곳</b>(카톡·인스타 안)에서 연 거야. '
    + '오른쪽 위 <b>···</b> → <b>다른 브라우저로 열기</b> 를 먼저 눌러 줘.</span>',
};

/* ⛔ 지금 앱(app.js)의 내려받을주소() 와 **같은 규칙**이어야 한다. 서버의 QR 도 같은 규칙으로
   그린다 — 한쪽만 고치면 그림과 글자가 서로 다른 주소를 가리킨다.
   ⛔ 그 밖의 주소는 손대지 않는다. 나중에 진짜 도메인을 달면 그게 손님께 보여야 할 주소다. */
const 집주소 = 'https://iamagoodperson.vercel.app';
const 집이름 = 'iamagoodperson.vercel.app';
const 내려받을주소 = () => {
  const h = location.hostname;
  /* ⛔ 여기에 역슬래시를 쓰지 않는다 — 이 자리에서 두 번 새어 규칙이 조용히 바뀌었다.
     정규식 대신 그냥 견준다. 읽기도 이쪽이 쉽다. */
  const 내컴퓨터 = (h === 'localhost' || h === '0.0.0.0' || h === '::1' || h === '[::1]'
    || h.indexOf('127.') === 0);
  const 미리보기 = h.endsWith('.vercel.app') && h !== 집이름;
  return (내컴퓨터 || 미리보기) ? 집주소 + '/' : location.origin + '/';
};

function sheetInstall() {
  /* 내 컴퓨터나 미리보기 주소에서는 그 주소를 QR 로 만들어 봐야 폰에서 안 열린다.
     서버가 같은 규칙으로 집주소를 넣어 그린다. */
  const 안드 = /Android/i.test(navigator.userAgent || '');
  const 이미 = 설치됨();
  const 주소 = 내려받을주소();
  pop(이미 ? '이미 놓여 있어' : '폰에 놓아두기',
    '<div class="u2sub" style="line-height:1.65">' + (이미
      ? '지금 <b>설치된 앱</b>으로 보고 있어.<br>다른 기기에도 놓고 싶으면 아래 QR 을 써. 적은 건 그대로 따라와.'
      : '홈 화면에 놓으면 <b>주소창도 탭도 없이</b> 앱처럼 열려.<br>'
        + '가계부는 <b>손이 닿는 자리</b>에 있어야 적게 돼.') + '</div>'
    + (이미 ? '' : (설치기회
        ? '<button class="u2go" id="insNow" style="margin-top:16px">지금 바로 놓기</button>'
          + '<div class="u2sub" style="margin:8px 2px 0">누르면 이 기기에 아이콘이 생겨.</div>'
        : ''))
       /* ⛔ **이미 깔려 있어도 놓는 법을 먼저 적는다** (사장님 2026-09-15 : 「홈에 설치하는것도 이미 깔아져있어도 우선순위로 적어줘」).
          식구 폰에 깔아 줄 때도, 지웠다 다시 깔 때도 이 걸음을 본다. QR 은 그 다음이다. */
    + '<div class="chips" style="margin:18px 0 12px">'
    +   '<button class="chip' + (안드 ? '' : ' on') + '" data-os="ios">아이폰</button>'
    +   '<button class="chip' + (안드 ? ' on' : '') + '" data-os="and">안드로이드</button></div>'
    + '<div class="u2steps" id="osGuide">' + (안드 ? 안내.and : 안내.ios) + '</div>'
    + '<div class="u2title" style="font-size:17px;margin:6px 2px 6px">다른 기기에도 놓고 싶으면</div>'
    + '<div class="u2sub" style="margin-bottom:10px;line-height:1.6">이 QR 은 '
    +   '<b>다른 기기</b>(PC·태블릿·식구 폰)에서 찍는 거야.</div>'
    + '<div class="u2qr"><img src="/api/ledger?r=qr" alt="설치 주소 QR" width="132" height="132">'
    +   '<div class="u2qr-s"><b>1</b> 다른 기기 카메라로 이 QR 을 비춰<br>'
    +   '<b>2</b> 열린 화면에서 <b>홈 화면에 추가</b><br>'
    +   '<span style="color:var(--faint)">적은 건 그대로 따라와</span></div></div>'
    + '<div class="u2link"><span id="insUrl">' + esc(주소) + '</span>'
    +   '<button id="insCopy">복사</button></div>'
    /* 릴스 고마움 — **설치 이야기를 다 마친 뒤**에 붙는다 (사장님이 자리를 고르심 2026-08-28).
       ⛔ 자리만 비워 두고 뒤에서 채운다. 이 창이 자료를 기다리면 안 된다. */
    + '<div id="insReels"></div>',
  (el, close) => {
    const now = $('#insNow', el);
    if (now) now.onclick = async () => {
      if (!설치기회) { toast('아래 안내대로 해 줘'); return; }
      now.disabled = true;
      try {
        /* ⛔ **기다린다(await).** prompt() 는 약속(Promise)을 돌려주는데 안 기다리면
           거절될 때 그 거절이 **아무도 안 받는 오류**로 새어 나간다(전수조사 2026-09-09 에 잡음).
           폰에서 이미 깔려 있거나 두 번 눌렸을 때 그렇게 된다. */
        await 설치기회.prompt();
        const r = await 설치기회.userChoice;
        설치기회 = null;                       // 한 번 쓰면 끝이다
        if (r && r.outcome === 'accepted') { close(); toast('놓았어'); }
        else { now.disabled = false; toast('아래 안내대로도 할 수 있어'); }
      } catch (e) { now.disabled = false; }
    };
    el.querySelectorAll('[data-os]').forEach((b) => b.onclick = () => {
      el.querySelectorAll('[data-os]').forEach((x) => x.classList.toggle('on', x === b));
      $('#osGuide', el).innerHTML = 안내[b.dataset.os];
    });
    $('#insCopy', el).onclick = async () => {
      try { await navigator.clipboard.writeText(주소); toast('주소를 복사했어'); }
      catch (e) {
        const r = document.createRange();
        r.selectNodeContents($('#insUrl', el));
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        toast('길게 눌러 복사해');
      }
    };
    /* 릴스 칸은 창이 뜬 뒤에 채운다 — 자료를 기다리느라 창이 늦으면 안 된다 */
    설치창릴스();
  });
}

/* ══ 릴스 · 굿펄슨 ═══════════════════════════════════════
   옛 화면(app.js)에만 남아 있던 **마지막 하나**. 사장님 마케팅이라 제 판단으로 옮기지 않고
   여쭈었고, 옮기라 하셨다 (2026-09-09).
   ⛔ 서버 길은 이미 있는 것을 그대로 쓴다 (/api/ledger?r=reels). 새 API 를 만들지 않는다.
   ⛔ 이름도 값도 **서버가 준다**(st.gift). 화면에 손으로 적어 두면 값이 바뀔 때 두 곳을
      고쳐야 하고, 한 곳을 잊으면 손님에게 거짓말이 나간다.
   ⛔ 꾸미개(.ticket .prodbox .reelrule .vowbox .mynum .insreels .reelrow)는 **app.css 것을
      그대로 쓴다.** 전부 테마 변수로만 그려서 이 화면에서도 그대로 산다 — 같은 그림을 두 벌
      두면 한쪽만 고쳐 놓고 다른 쪽이 조용히 어긋난다 (머리말의 「.chip 은 일부러 앱 것」과 같은 뜻).
   ⛔ 손님에게 하는 말은 **반말**이다. 옛 화면 존댓말을 그대로 옮기지 않았다.
      **사장님 화면만 존댓말**이다 — 거기 계신 분이 사장님이다.
   ⛔ st.text(제목·첫 안내·약속·쓰는 법)는 **사장님이 손으로 적으신 글**이라 말투를 손대지 않고
      그대로 그린다. 고치는 곳은 사장님 화면의 「손님에게 보이는 글 고치기」 하나뿐이다. */
async function sheetReels(조용히) {
  /* ⚡ 누르면 창부터 뜬다 (2026-09-17) — 받는 사이 닫으셨으면 다시 안 연다 */
  const 잠깐 = 조용히 ? null : pop('릴스 · 굿펄슨', '<div class="u2empty" data-wait="reels">불러오는 중…</div>');
  let st = null;
  try { st = await api('reels'); } catch (e) { if (잠깐) 잠깐(); if (!조용히) toast(e.message); return; }
  if (잠깐) { if (!document.querySelector('[data-wait="reels"]')) return; 잠깐(); }
  /* 조용히 = 결제를 막 마친 자리. 줄 것이 없으면 아무것도 안 띄운다. */
  if (조용히 && (st.owner || !st.paid || st.mine || !st.open)) return;

  /* 「2026-11-25」를 「11월 25일」로. 해가 넘어가면 해까지 적는다. */
  const 날짜말 = (d) => {
    if (!d || d.length < 10) return '';
    return (d.slice(0, 4) === (st.today || '').slice(0, 4) ? '' : Number(d.slice(0, 4)) + '년 ')
      + Number(d.slice(5, 7)) + '월 ' + Number(d.slice(8, 10)) + '일';
  };
  const 지났나 = (d) => !!(d && st.today && d < st.today);

  /* 사장님이 적으신 글 — ⛔ **날 것으로 그리지 않는다.** 글자는 전부 막고 별표(*굵게*)
     하나만 살린다. 손님에게 나가는 글이라 아무 표가 통하면 안 된다.
     ⛔ 줄바꿈은 살린다 — 사장님이 개행하신 자리가 화면에서도 개행이라야 한다. */
  const 글 = (k) => String((st.text || {})[k] || '');
  const 굵게 = (t) => esc(t).split('*').map((x, i) => (i % 2 ? '<b>' + x + '</b>' : x)).join('');
  const 여러줄 = (t) => 굵게(t).split(String.fromCharCode(10)).join('<br>');
  const 목록으로 = (t) => 글(t).split(String.fromCharCode(10))
    .map((x) => x.trim()).filter(Boolean).map((x) => '<li>' + 굵게(x) + '</li>').join('');
  const 칸 = (이름, 곁말, 속) => '<div class="u2reelfld"><label class="u2hand">' + 이름
    + (곁말 ? '<span>' + 곁말 + '</span>' : '') + '</label>' + 속 + '</div>';

  /* ── 사장님 화면 — **보는 자리**이지 여는 자리가 아니다 ────────
     ⛔ 주고 올리고 내리는 것은 다 저절로 된다 (2026-08-27 : 「내가 관리하지않아도 자동으로」).
        규칙은 api/ledger.js 의 REELS 주석에 있다. */
  if (st.owner) {
    const 목록 = st.list || [];
    /* 남은 꾸러미를 한 줄로 — 「명함 1 · 오브 1 · 카드뉴스 5」 */
    const 남은짧게 = (items) => (st.gift || [])
      .map((g) => g.s + ' ' + ((items && items[g.id] !== undefined) ? items[g.id] : g.q)).join(' · ');
    const 굿 = 목록.filter((x) => x.partner).length;
    const 편 = 목록.reduce((a, x) => a + (x.n || 0), 0);
    const 줄 = 목록.map((x) => '<div class="reelrow' + (x.off ? ' off' : '') + '" data-rw="' + esc(x.ws) + '">'
      + '<div class="rtop"><b>' + esc(x.at || '')
      +   (x.partner ? ' <span class="goodtag">굿펄슨</span>' : '') + '</b>'
      +   '<em>' + (x.off ? '거둬들임' : (x.code ? esc(x.code) + ' · ' + 남은짧게(x.items) : '')) + '</em></div>'
      + '<div class="rsub">올린 것 ' + x.n + '편'
      +   (x.until && !x.off ? ' · ' + (지났나(x.until) ? '기간 지남' : 날짜말(x.until) + '까지') : '') + '</div>'
      + (x.urls || []).map((u) => '<a class="rurl" href="' + esc(u.u) + '" target="_blank" rel="noopener">'
      +   (u.vow ? '<i class="vowok">표시 확인</i> ' : '') + esc(u.at) + ' · ' + esc(u.u) + '</a>').join('')
      + (x.warn ? '<div class="rwarn">' + (x.warn.fixed
        ? '고쳤다고 하셨어요 · ' + 날짜말(x.warn.fixed)
        : (x.warn.gone ? '말미가 지나 저절로 거둬졌어요 · ' + 날짜말(x.warn.gone)
          : '표시를 고쳐 달라고 했어요 · ' + 날짜말(x.warn.until) + '까지')) + '</div>' : '')
      /* 표시 없음 — **한 번만 누르시면 된다.** 그 뒤는 저절로 돈다 :
         손님 화면에 안내가 뜨고 · 쿠폰이 멈추고 · 말미가 지나면 저절로 거둬진다. */
      + '<div class="chips" style="margin-top:8px">'
      +   '<button class="chip sm' + (x.warn && !x.warn.fixed ? ' on' : '') + '"'
      +     ' data-rwarn="' + (x.warn ? '' : '1') + '">' + (x.warn ? '표시 없음 취소' : '표시 없음') + '</button>'
      +   '<button class="chip sm' + (x.off ? ' on' : '') + '"'
      +     ' data-roff="' + (x.off ? '' : '1') + '">' + (x.off ? '되돌리기' : '거둬들이기') + '</button>'
      + '</div></div>').join('');
    return pop('릴스 · 굿펄슨',
      '<div class="u2sub" style="line-height:1.65;margin-bottom:14px"><b>굿펄슨 ' + 굿 + '명</b>'
      +   ' · 올린 것 ' + 편 + '편<br>주고 올리고 내리는 것은 <b>다 저절로</b> 됩니다.'
      +   ' 이상한 것만 <b>거둬들이기</b>를 눌러 주세요.</div>'
      /* 받기 스위치 — 숫자를 세는 대신 이것 하나다. 감당이 안 될 때만 누르신다. */
      + '<div class="chips" style="margin-bottom:14px">'
      +   '<button class="chip' + (st.open ? ' on' : '') + '" data-ropen="1">지금 받는 중</button>'
      +   '<button class="chip' + (st.open ? '' : ' on') + '" data-ropen="">그만 받기</button></div>'
      + (줄 || '<div class="u2empty">아직 올라온 것이 없어요</div>')
      + '<button class="u2go" id="reelsText" style="margin-top:16px">손님에게 보이는 글 고치기</button>',
    (el, close) => {
      el.querySelectorAll('[data-ropen]').forEach((b) => b.onclick = async () => {
        const 켬 = b.dataset.ropen === '1';
        if (켬 === !!st.open) return;
        /* ⚡ 알약부터 옮긴다 */
        el.querySelectorAll('[data-ropen]').forEach((x) => x.classList.toggle('on', x === b));
        try {
          await api('reels', { body: { op: 'open', on: 켬 } });
          close(); toast(켬 ? '다시 받습니다' : '그만 받습니다'); sheetReels();
        } catch (e) { el.querySelectorAll('[data-ropen]').forEach((x) => x.classList.toggle('on', (x.dataset.ropen === '1') === !!st.open)); toast(e.message); }
      });
      $('#reelsText', el).onclick = () => { close(); setTimeout(() => sheetReelsText(st), 200); };
      el.querySelectorAll('[data-rwarn]').forEach((b) => b.onclick = async () => {
        const row = b.closest('[data-rw]');
        if (b.dataset.rwarn === '1'
          && !confirm('표시가 없다고 알릴까요? 손님 화면에 안내가 뜨고, 7일 안에 안 고치면 저절로 거둬집니다.')) return;
        row.style.opacity = '.45';
        try {
          await api('reels', { body: { op: 'warn', ws: row.dataset.rw, on: b.dataset.rwarn === '1' } });
          close(); sheetReels();
        } catch (e) { row.style.opacity = ''; toast(e.message); }
      });
      el.querySelectorAll('[data-roff]').forEach((b) => b.onclick = async () => {
        const row = b.closest('[data-rw]');
        if (b.dataset.roff === '1' && !confirm('이 분 쿠폰을 멈출까요? 번호가 안 쓰이게 됩니다.')) return;
        row.style.opacity = '.45';
        try {
          await api('reels', { body: { op: 'off', ws: row.dataset.rw, on: b.dataset.roff === '1' } });
          close(); sheetReels();
        } catch (e) { row.style.opacity = ''; toast(e.message); }
      });
    });
  }

  /* ── 손님 화면 ─────────────────────────────────────────
     ⛔ 이용권을 **산 사람에게만** 준다. 안 산 사람에게는 왜 못 받는지만 한 줄로 말한다. */
  if (!st.paid) {
    return pop('영상·글 올리고 쿠폰 받기',
      '<div class="u2sub" style="line-height:1.65">이건 <b>이용권 산 사람한테</b> 주는 고마움이야.'
      + '<br>먼저 써 보고 마음에 들면 그때 올려 줘.</div>'
      + '<div class="u2btns" style="margin-top:18px"><button class="go" data-x>닫기</button></div>');
  }

  const 내것 = st.mine;
  /* 표시가 빠졌다고 알린 상태 — **다른 무엇보다 먼저** 보여준다.
     ⛔ 무엇이 빠졌는지·언제까지인지·안 고치면 어떻게 되는지 셋을 다 적는다.
        하나라도 빠지면 손님은 「왜 멈췄지」로 남는다. */
  if (내것 && 내것.warn && !내것.warn.fixed && !내것.warn.gone) {
    return pop('포스팅에 한 줄만 넣어 줘',
      '<div class="u2sub" style="line-height:1.65">올려 준 글에 <b>「쿠폰을 받고 올렸어요」</b>가 안 보여.'
      + '<br>법으로 정해진 표시라 <b>꼭 있어야</b> 해.</div>'
      + '<div class="u2link" style="margin-top:14px"><span id="vowLine">쿠폰을 받고 올렸어요</span>'
      +   '<button id="vowCopy">복사</button></div>'
      + '<div class="u2sub" style="line-height:1.65;margin-bottom:16px"><b>' + 날짜말(내것.warn.until)
      +   '까지</b> 넣어 주면 쿠폰은 그대로 살아 있어.<br>그때까지 안 넣으면 <b>쿠폰이 멈춰.</b></div>'
      + '<div class="u2btns"><button class="ghost" data-x>나중에</button>'
      +   '<button class="go" id="vowDone">넣었어</button></div>',
    (el, close) => {
      $('#vowCopy', el).onclick = async () => {
        try { await navigator.clipboard.writeText('쿠폰을 받고 올렸어요'); toast('복사했어'); }
        catch (e) {
          const r = document.createRange();
          r.selectNodeContents($('#vowLine', el));
          const s = getSelection(); s.removeAllRanges(); s.addRange(r);
          toast('길게 눌러 복사해');
        }
      };
      $('#vowDone', el).onclick = async () => {
        const b = $('#vowDone', el);
        b.disabled = true; b.textContent = '보내는 중…';
        try { await api('reels', { body: { op: 'fixed' } }); close(); toast('고마워'); sheetReels(); }
        catch (e) { toast(e.message); b.disabled = false; b.textContent = '넣었어'; }
      };
    });
  }
  if (내것 && 내것.off) {
    return pop('이 번호는 멈췄어',
      '<div class="u2sub" style="line-height:1.65">' + ((내것.warn && 내것.warn.gone)
        ? '「쿠폰을 받고 올렸어요」를 넣어 달라고 했는데 말미 안에 안 들어왔어.'
        : '올려 준 것이 약속한 넷과 달랐어.')
      + '<br>궁금하면 <b>카카오톡</b>으로 말해 줘.</div>'
      + '<div class="u2btns" style="margin-top:18px"><button class="go" data-x>닫기</button></div>');
  }
  if (!내것 && !st.open) {
    return pop('지금은 쉬고 있어',
      '<div class="u2sub" style="line-height:1.65">고마움을 주는 자리를 <b>잠깐 닫아 뒀어.</b>'
      + '<br>다시 열면 그때 알려 줄게.</div>'
      + '<div class="u2btns" style="margin-top:18px"><button class="go" data-x>닫기</button></div>');
  }

  /* 쿠폰으로 만들 수 있는 것 — **「몇 번」이 아니라 「무엇을 몇 개」**
     (사장님 정하심 2026-08-27 : 「5번의 쿠폰 대신 로키명함 1개 오브1개 카드뉴스 5장」). */
  const 선물 = st.gift || [];
  /* ⛔ 합계도 보는 자리에 따라 다르다. 받기 전에는 **주는 값**, 받은 뒤에는 **아직 남은 값**이다.
     다 썼는데 30,000원어치라고 적으면 거짓말이 된다. */
  const 총값 = 선물.reduce((a, x) => a + x.q * x.v, 0);
  const 남은 = (id) => {
    const it = (내것 && 내것.items) || null;
    const 기본 = (선물.find((x) => x.id === id) || {}).q || 0;
    return it && it[id] !== undefined ? Number(it[id]) : 기본;
  };
  const 남은값 = () => 선물.reduce((a, x) => a + 남은(x.id) * x.v, 0);
  /* ⛔ **남은 것만** 적는다 (2026-08-29). 다 쓴 것을 「0장」으로 늘어놓으면
     쿠폰이 아직 뭔가 든 것처럼 보인다. */
  const 한줄요약 = () => {
    const 남은것 = 선물.filter((x) => 남은(x.id) > 0);
    if (!남은것.length) return '다 썼어';
    return 남은것.map((x) => x.n + ' ' + 남은(x.id) + (x.w[0] === '장' ? '장' : '편')).join(' · ');
  };
  /* 이름에 붙는 그림 — 이름은 서버가 주니 **글자로** 맞춘다. 모르는 이름은 🎁 */
  const 그림 = (n) => /명함/.test(n) ? '🪪' : /영상|오브/.test(n) ? '🎬' : /카드/.test(n) ? '🗞️' : '🎁';
  const 꾸러미표 = (남은것으로) => 칸(남은것으로 ? '이 번호로 만들 수 있는 것' : '한 편 올리면 이걸 줄게 🎁',
    남은것으로 ? '' : '한 사람당 한 번',
    '<div class="prodbox">' + 선물.map((x) => {
      const q = 남은것으로 ? 남은(x.id) : x.q;
      return '<div class="prodrow' + (q ? '' : ' gone') + '"><i class="u2emo">' + 그림(x.n) + '</i>'
        + '<b>' + esc(x.n) + '</b>'
        + '<span>' + q + esc(x.w) + '</span>'
        + '<em>' + (q ? won(q * x.v) + '<small>원</small>' : '다 썼어') + '</em></div>';
    }).join('')
    + '<div class="prodrow sum"><b>모두 합치면</b><em>'
    +   won(남은것으로 ? 남은값() : 총값) + '<small>원어치</small></em></div></div>');

  /* 쓰는 길 — **네 걸음으로 못 박는다.**
     ⛔ 지금은 셋째 걸음에 사람이 들어간다. 카프카로키 화면에 번호 넣는 칸이 아직 없어서다.
        그 칸이 생기면 셋째·넷째 걸음이 「번호를 넣으면 끝」 한 줄로 줄어든다. */
  const 쓰는법 = 칸('쓰는 법', '', '<ol class="reelrule">' + 목록으로('steps') + '</ol>')
    + '<a class="u2go" href="https://kafka-roki.com/self.html" target="_blank" rel="noopener">셀프제작 보러 가기</a>'
    + '<a class="u2go ghost" href="https://open.kakao.com/o/spYpcJyi" target="_blank" rel="noopener"'
    +   ' style="margin-top:10px">카카오톡으로 번호 보내기</a>';

  /* ⛔ 약속은 넷을 넘기지 않는다. 조건이 다섯 줄이 되는 순간 아무도 안 읽는다.
     ⛔ 셋째 줄은 **법으로 정해진 표시**다(공정위 추천·보증 심사지침). 대가를 받고 올린
        영상에 그 표시가 없으면 올려 준 사람이 곤란해진다 — 우리가 챙겨야 한다. */
  const 규칙 = 칸('약속', '', '<ol class="reelrule">' + 목록으로('rules') + '</ol>')
    + 칸('올린 주소', '',
      '<div class="u2fld" style="margin-bottom:0">'
      +   '<input id="reelUrl" type="url" inputmode="url" placeholder="https://"></div>'
      + '<div class="u2sub" style="margin-top:7px">인스타 · 틱톡 · 유튜브 · 네이버 블로그 ·'
      +   ' 티스토리 · 브런치를 받아.</div>')
    /* ⛔ **눌러야 보내진다** (2026-08-28). 화면에 적어 두는 것만으로는 「알렸다」까지다.
       손님이 스스로 눌러야 「확인받았다」가 되고, 그 기록이 우리를 지킨다.
       ⛔ 미리 눌러 두지 않는다. 손님이 손으로 눌러야 뜻이 있다. */
    + '<label class="vowbox" for="reelVow"><input type="checkbox" id="reelVow">'
    +   '<span>포스팅에 <b>「쿠폰을 받고 올렸어요」</b>를 넣었어'

  /* 굿펄슨이 무엇인가 — **세 줄이면 끝이다** (사장님 정하심 2026-08-28).

  /* 보내기 단추 — 두 화면이 같이 쓴다. 보내고 나면 **번호가 나온 화면으로 갈아탄다.**
     ⛔ 알림 한 줄로 끝내지 않는다. 방금 받은 번호를 바로 봐야 한다. */
  const 보내기묶기 = (el, close) => {
    const 주소칸 = $('#reelUrl', el), 단추 = $('#reelSend', el);

      try { await api('reels', { body: { url: 주소칸.value, vow: true } }); close(); sheetReels(); }
      catch (e) { toast(e.message); 단추.textContent = 본디; 단추.disabled = false; }
    };
  };
  /* 번호 복사 — 폰에서 길게 눌러 잡기가 어렵다. 한 번 눌러 담아 준다. */
  const 번호복사 = async (엘) => {

  /* 아직 한 편도 안 낸 사람 */
  if (!내것) {
    return pop(esc(글('title')),
      '<div class="u2reellead">' + 여러줄(글('lead')) + '</div>'
      + 꾸러미표(false) + 규칙
      + '<button class="u2go" id="reelSend">보내기</button>'
      + '<div class="u2btns" style="margin-top:10px"><button class="ghost" data-x>나중에</button></div>',

  /* 다 쓴 사람 — **짧게 끝낸다.** 남은 것이 없는데 쓰는 법과 번호를 늘어놓으면

  if (내것.code && 남은값() === 0 && !지났나(내것.until)) {

      + '<b class="tk-code">' + esc(내것.code) + '</b>'
      + '<div class="tk-cut"><i class="l"></i><i class="r"></i></div>'
      + '<div class="tk-body"><div class="tk-items">다 썼어</div></div></div>'
      + '<div class="u2sub" style="line-height:1.65;margin-top:14px">꾸러미를 <b>다 썼어.</b> 고마워.'

  /* 이미 받은 사람 — 번호가 주인공이고, 그 아래에 「무엇을 만드나 · 어떻게 쓰나」가 온다.
     ⛔ 쿠폰은 **진짜 종이 쿠폰처럼** 그린다 (사장님 지시 2026-08-28). 번호만 덩그러니
        있으면 「받았다」는 느낌이 안 난다. 받은 것은 기분이기도 하다.
     ⛔ 뜯는 자리의 반달은 **창 바탕색**이라야 뚫린 것처럼 보인다 — .u2pop-in 도 --paper 다. */
  const 굿 = !!내것.partner;
  pop(굿 ? '굿펄슨이야' : '고마워',
    '<div class="ticket' + ((지났나(내것.until) || 남은값() === 0) ? ' over' : '') + '">'
    + '<div class="tk-head"><span>카프카로키 셀프제작</span>'

    + 꾸러미표(true) + 쓰는법
    /* ⛔ 셋째 걸음에서 보낼 **그 번호**를 걸음 바로 밑에 둔다 (사장님 지시 2026-08-28).
       위 쿠폰에도 있지만, 걸음을 읽다 말고 위로 올라가게 하지 않는다. */

  (el, close) => {

/* 손님에게 보이는 글 — **사장님이 직접 고치신다** (지시 2026-08-28 : 「거기 창 내가 직접

/* 폰에 놓아두기 창이 열린 **뒤에** 릴스 칸을 채운다.
   ⛔ 자리만 비워 두고 뒤에서 채운다 — 이 창은 자료를 기다리지 않고 바로 떠야 한다.
      못 채워도 창은 멀쩡하다.
   ⛔ 이용권을 **산 사람에게만** 채운다. 안 산 사람에게는 아예 안 그린다.
   ⛔ 가운데 끼우지 않는다. 설치하려고 연 창인데 중간에 딴 이야기가 끼면 이야기가 끊긴다. */
async function 설치창릴스() {
  const 자리 = $('#insReels');
  if (!자리) return;
  const lic = (D || {}).lic || {};
  if (!lic.paid || lic.owner) return;
  let st = null;
  try { st = await api('reels'); } catch (e) { return; }
  /* 이미 냈거나 지금 안 받는 중이면 안 권한다 */
  if (!st || !st.gift || st.mine || !st.open) return;
  const 값 = st.gift.reduce((a, x) => a + x.q * x.v, 0);
  const 무엇 = st.gift.map((x) => x.s + ' ' + x.q + x.u).join(' + ');
  /* ⛔ 속칸을 .tx 로 두지 않는다 — app.css 의 적은줄(.tx{display:flex})이 새어 들어와
     두 줄이 위아래가 아니라 옆으로 붙는다. 짧은 이름에는 u2 를 붙인다(머리말 규칙). */
  자리.innerHTML = '<div class="insreels"><div class="u2instx"><b>영상·글 1편 = ' + won(값) + '원어치</b>'
    + '<span>' + esc(무엇) + '</span></div>'
    + '<button class="btn" id="insReelsGo">보기</button></div>';
  const b = $('#insReelsGo');
  if (b) b.onclick = () => sheetReels();
}

/* ── 잘 쓰고 계세요? ──────────────────────────────────────
   「잘 샀나」가 아니라 「잘 쓰고 있나」를 묻는다. 산 것은 되돌릴 수 없지만
   안 쓰는 물건은 팔 수 있고 안 보는 구독은 끊을 수 있다.
   ⛔ 한 번에 **하나만** 묻는다. 여러 개를 늘어놓으면 아무 답도 안 하게 된다. */
function useCard(d) {
  const u = d.use || {};
  const sell = (u.sell || []).filter((s) => s.name);
  const sub = u.sub || { one: null, left: 0, cut: [] };
  const cut = sub.cut || [];
  if (!u.one && !sell.length && !sub.one && !cut.length && !u.done) return '';

  const 세단추 = (one, 구독) => '<div class="u2use-b" data-key="' + esc(one.key) + '"'
    + ' data-name="' + esc(one.name) + '"' + (구독 ? ' data-sub="1"' : '') + '>'
    + '<button data-v="good"><em>👍</em>잘 쓰는 중</button>'
    + '<button data-v="meh"><em>😐</em>가끔</button>'
    + '<button class="no" data-v="no"><em>' + (구독 ? '✂️' : '📦') + '</em>안 씀</button></div>';

  let h = '<div class="u2card">'
    + '<div class="u2head"><b style="font-size:18px">잘 쓰고 있어?</b>'
    +   '<span class="u2sub">' + (u.left > 1 ? u.left + '개 남음 · ' : '')
    +   '<button class="u2tap" data-ans style="text-decoration:underline">답한 것</button></span></div>';
  h += u.one
    ? '<div class="u2use-i"><div class="n">' + esc(u.one.name) + '</div>'
      + '<div class="d">' + (u.one.kind === '구독' ? '매달' : md(u.one.d)) + ' · <b>'
      + won(u.one.amt) + '원</b></div></div>' + 세단추(u.one, false)
    : '<div class="u2empty">다 답했어</div>';
  h += '</div>';

  if (sub.one || cut.length) {
    h += '<div class="u2card"><div class="u2head"><b style="font-size:18px">구독은 안 보면 해지</b></div>';
    if (sub.one) {
      h += '<div class="u2use-i"><div class="n">' + esc(sub.one.name) + '</div>'
        + '<div class="d">매달 <b>' + won(sub.one.amt) + '원</b> · 1년이면 <b>'
        + won(sub.one.amt * 12) + '원</b></div></div>' + 세단추(sub.one, true);
      if (sub.left > 1) h += '<div class="u2sub" style="margin-top:9px">' + sub.left + '개 더 남았어</div>';
    }
    if (cut.length) {
      h += '<div style="margin-top:12px">' + cut.map((c) =>
        '<div class="u2sell"><span class="n">' + esc(c.name) + '</span>'
        + '<span class="v">1년 ' + won(c.amt * 12) + '원</span>'
        + '<button data-cut="' + esc(c.id) + '">해지했어</button></div>').join('') + '</div>'
        + '<div class="u2sub" style="margin-top:9px">해지하면 눌러 줘. 매달 나가는 목록에서 빠져.</div>';
    }
    h += '</div>';
  }

  if (sell.length) {
    h += '<div class="u2card"><div class="u2head"><b style="font-size:18px">안 쓰면 당근·번개</b>'
      + '<span class="u2sub">' + won(sell.reduce((a, s) => a + (s.ask || 0), 0)) + '원</span></div>'
      + sell.map((s) =>
          '<div class="u2sell"><span class="n">' + esc(s.name) + '</span>'
          + '<span class="v">' + (s.ask ? won(s.ask) + '원' : '값 미정') + '</span>'
          + '<button data-sold="' + esc(s.key) + '">팔았어</button></div>').join('')
      + '<div class="u2sub" style="margin-top:9px">팔면 <b>들어온 돈</b>으로 적어 줄게.</div></div>';
  }
  return h;
}

/* 안 쓴다고 하면 「얼마에 팔아볼까」로 이어진다 */
function sheetSell(key, name) {
  pop('얼마에 팔아볼까?',
    '<div class="u2sub" style="margin-bottom:14px"><b>' + esc(name) + '</b> · 안 쓰고 있구나. '
    +   '값을 정해 두면 올리기 쉬워.</div>'
    + '<div class="u2fld"><label>올릴 값</label>'
    +   '<input id="sellAmt" inputmode="numeric" placeholder="0"></div>'
    + '<div class="u2quick"><button data-add="5000">+5천</button>'
    +   '<button data-add="10000">+1만</button><button data-add="50000">+5만</button></div>'
    + '<div class="u2btns" style="margin-top:16px"><button class="ghost" data-x>그만</button>'
    +   '<button class="go" id="sellOk">팔 것에 넣기</button></div>',
  (el, close) => {
    const a = $('#sellAmt', el);
    a.oninput = () => { const n = a.value.replace(/[^0-9]/g, ''); a.value = n ? won(n) : ''; };
    el.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => {
      const cur = Number(a.value.replace(/[^0-9]/g, '')) || 0;
      a.value = won(cur + Number(b.dataset.add));
    });
    setTimeout(() => a.focus(), 250);
    $('#sellOk', el).onclick = async () => {
      close();
      /* ⚡ 팔 것 칸에 먼저 올린다 — 다음 물음은 서버가 골라 준다 */
      const 값 = Number(String(a.value).replace(/[^0-9]/g, '')) || 0;
      const 되돌림 = 먼저그리기((d) => {
        const u = d.use = Object.assign({}, d.use);
        u.sell = (u.sell || []).filter((s) => s.key !== key).concat({ key, name, ask: 값 });
        if (u.one && u.one.key === key) u.one = null;
      });
      toast('팔 것에 넣었어');
      try { D = await api('use', { body: { key, name, v: 'no', ask: a.value, viewM: M } }); render(); }
      catch (e) { 되돌림(); toast(e.message); }
    };
  });
}

/* 답한 것 — 받아만 두고 볼 곳이 없으면 「내가 뭐라고 했더라」를 알 길이 없다 */
const ANS = { good: '잘 쓰는 중', meh: '가끔', no: '안 씀' };
async function sheetAnswers() {
  /* ⚡ 창부터 연다 (2026-09-17) — 목록은 받는 대로 채운다. 기다리는 사이 닫으셨으면 다시 안 연다 */
  const 잠깐 = pop('답한 것', '<div class="u2empty">불러오는 중…</div>');
  const 열림 = () => [...document.querySelectorAll('.u2pop .u2pop-h b')].some((b) => b.textContent === '답한 것');
  let rows = [];
  try { rows = (await api('answers')).rows || []; } catch (e) {}
  if (!열림()) return;
  잠깐();
  /* 「안 씀」을 위로 올린다 — 손볼 것이 거기에 있다 */
  const 차례 = { no: 0, meh: 1, good: 2 };
  const 줄 = rows.slice().sort((a, b) => (차례[a.v] ?? 9) - (차례[b.v] ?? 9)
    || String(b.at).localeCompare(String(a.at)));
  pop('답한 것',
    '<div class="u2sub" style="margin-bottom:12px">「다시 묻기」를 누르면 그걸 <b>다시 물어봐.</b></div>'
    + (줄.length ? 줄.map((a) =>
        '<div class="u2ansrow"><em class="u2ansv ' + esc(a.v) + '">' + (ANS[a.v] || esc(a.v)) + '</em>'
        + '<span class="n">' + esc(a.name || '(이름 없음)')
        + '<s>' + (a.at ? esc(String(a.at).slice(5).replace('-', '/')) : '') + '</s></span>'
        + '<button data-unans="' + esc(a.key) + '">다시 묻기</button></div>').join('')
      : '<div class="u2empty">아직 답한 게 없어</div>'),
  (el, close) => {
    el.querySelectorAll('[data-unans]').forEach((b) => b.onclick = async () => {
      /* ⚡ 그 줄을 먼저 걷는다 */
      b.disabled = true;
      const 줄 = b.closest('.u2ansrow');
      if (줄) 줄.style.display = 'none';
      toast('다시 물어볼게');
      try {
        D = await api('use', { body: { key: b.dataset.unans, v: 'clear', viewM: M } });
        render();
      } catch (e) { b.disabled = false; if (줄) 줄.style.display = ''; toast(e.message); }
    });
  });
}

/* 위 세 상자의 단추를 잇는다 — render() 뒤에 wire() 가 부른다 */
function wireUse() {
  document.querySelectorAll('[data-ans]').forEach((b) => b.onclick = () => sheetAnswers());
  document.querySelectorAll('.u2use-b button').forEach((b) => b.onclick = async () => {

/* ── 글씨 크기 ────────────────────────────────────────
   ⛔ 이 화면은 크기를 픽셀로 박아 두었다. 그래서 낱낱을 고치는 대신 **통째로 키운다**
      (CSS zoom). 폰 브라우저의 글씨 크기 설정과 달리, 앱으로 깔았을 때도 먹는다. */
const ZKEY = 'u2zoom';
function 크기입히기(v) {
  /* ⛔ 기본이 **「작게」(0.9)** 다 (사장님 2026-09-09 : 「글씨가 작게를 눌러야지 메인 홈에서

  /* ⛔ 상한은 1(보통). 크게·더 크게를 골라 두셨던 기기도 여기서 보통으로 내려온다. */
  const z = Math.min(1, Math.max(0.9, Number(v) || 0.9));

     제자리에 붙어 있어(position:fixed) 안 커진다. */
  document.documentElement.style.zoom = String(z);

  return z;

   ⛔ 창이 안 보이거나 무언가 열려 있으면 안 묻는다 — 적는 중에 화면이 갈리면 안 된다. */
let 지켜보는중 = null, 묻는중 = false, 마지막손길 = Date.now();
async function 딴기기확인() {
  if (묻는중 || !D || document.hidden || document.querySelector('.u2pop')) return;
  묻는중 = true;
  try {
    const j = await api('rev');
    if (j && j.ok && Number(j.rev) !== Number(D.rev)) {
      달보관 = {};   // 딴 기기에서 바뀌었다 · 미리 받아 둔 달은 옛것
      if (document.querySelector('.u2pop')) return;   // 묻는 사이에 창을 열었을 수 있다
      await load(M);
    }
  } catch (e) { /* 인터넷이 끊겼을 뿐이다. 다음 차례에 다시 본다 */ }
  finally { 묻는중 = false; }
}
function 딴기기지켜보기() {
  if (지켜보는중) return;
  const 다음 = () => (Date.now() - 마지막손길 < 2 * 60 * 1000 ? 20000 : 90000);
  const 예약 = () => {
    clearTimeout(지켜보는중);
    지켜보는중 = setTimeout(() => { 딴기기확인(); 예약(); }, 다음());
  };
  예약();
  const 지금바로 = () => { 마지막손길 = Date.now(); 딴기기확인(); 예약(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) 지금바로(); });
  addEventListener('focus', 지금바로);
  addEventListener('online', 지금바로);
  /* 만질 때마다 묻지 않는다 — 손길은 적어만 두고, 느리게 가던 중이었을 때만 따라잡는다.
     안 그러면 손가락 한 번에 저장소를 수십 번 두드린다. */
  const 손길 = () => {
    const 느리게가던중 = Date.now() - 마지막손길 >= 2 * 60 * 1000;
    마지막손길 = Date.now();
    if (느리게가던중) { 딴기기확인(); 예약(); }
  };
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((e) =>
    addEventListener(e, 손길, { passive: true }));
}

      앱으로 깔면 주소창도 뒤로 단추도 없다. 그 화면에서 나올 길이 없다.
   → 폰이 파일을 **공유 창**으로 넘길 수 있으면 공유 창을 띄운다(파일에 저장 · 카톡). 닫으면 그대로 앱이다.
   → 공유를 못 하는데 앱으로 깔려 있으면 **새 창**으로 연다 — 아이폰은 그 창에 「완료」 단추가 붙는다.
   ⛔ 둘 다 아니면(PC 브라우저) 예전처럼 주소로 받는다. 거기는 뒤로 갈 길이 있다.

async function 엑셀받기() {
  const 주소 = '/api/ledger?r=csv&m=' + encodeURIComponent(M);
  const 이름 = 'ledger-' + M + '.csv';
  /* ⛔ **공유 창은 폰·앱에서만** (교차검증 2026-09-15). PC 크롬·엣지도 navigator.share 가 있어서, 막지 않으면
     PC 에서 누른 분께 「파일 저장」이 없는 윈도우 공유 창이 뜬다 — 받을 길이 없어진다. PC 는 예전처럼 주소로 받는다. */
  const 폰이나앱 = 설치됨() || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  if (폰이나앱 && navigator.share && navigator.canShare) {
    try {
      const res = await fetch(주소, { credentials: 'same-origin' });
      if (!res.ok) throw new Error('못 받았어 · 잠시 뒤 다시 해 줘');
      const f = new File([await res.blob()], 이름, { type: 'text/csv' });
      if (navigator.canShare({ files: [f] })) {
        await navigator.share({ files: [f], title: 이름 });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;          // 손님이 공유 창을 닫았다
      if (!(e && e.name === 'NotAllowedError')) { toast(e.message || '못 받았어'); return; }

    }
  }
  if (설치됨()) { window.open(주소, '_blank'); return; }
  location.href = 주소;
}

/* 잔액 고치기 — 홈에서 누르나 설정에서 누르나 **같은 자리**로 온다.
   ⛔ 화면에 보이는 잔액을 그대로 띄운다. 넣어 두신 사진값(cfg.hold.have)이 아니라
      **지금 보고 계신 숫자**다 — 손님 뜻은 「이 숫자가 틀렸으니 이걸로 바꿔 줘」이기 때문이다.
   ⛔ 넣으시면 그 시각부터 다시 센다(서버가 haveAt 을 새로 찍는다). 그래서 넣으신 값이
      화면에 그대로 뜬다. */
function 잔액고치기(c) {
  const h = (D.cfg || {}).hold || {};
  const 지금 = (c && Number(c.잔액)) || Number(h.have) || 0;
  askMoney('지금 통장에 얼마 있어?', 지금, async (v) => {

       아무 일도 안 일어난다**(서버 쪽 주석 참고). 손님은 눌러도 안 바뀐다고 겪는다. */
    /* ⚡ 잔액부터 바꿔 그린다 — 넣는 순간이 새 기준이라 그 뒤 움직임(moved)은 0 이다 */
    const 되돌림 = 먼저그리기((d) => {
      d.hold = Object.assign({}, d.hold, { have: v, haveSet: v, moved: 0, haveAt: Date.now() });
      d.cfg = Object.assign({}, d.cfg, { hold: Object.assign({}, h, { have: v }) });

      await load(M);

  });
}

/* ══ 도장 그림·효과 ════════════════════════════════════
   사랑스러운 인장 — 물결진 테 안에 웃는 하트. */
const SEAL = (() => {
  let d = ''; const N = 12, R = 40, B = 6.5;
  for (let i = 0; i < N; i++) {
    const a0 = (i / N) * 6.2832 - 1.5708, a1 = ((i + 1) / N) * 6.2832 - 1.5708, am = (a0 + a1) / 2;
    const x0 = 50 + Math.cos(a0) * R, y0 = 50 + Math.sin(a0) * R;
    const x1 = 50 + Math.cos(a1) * R, y1 = 50 + Math.sin(a1) * R;
    const cx = 50 + Math.cos(am) * (R + B), cy = 50 + Math.sin(am) * (R + B);
    d += (i ? '' : 'M' + x0.toFixed(1) + ' ' + y0.toFixed(1))
       + 'Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x1.toFixed(1) + ' ' + y1.toFixed(1);
  }
  return '<svg viewBox="-6 -6 112 112">'
    + '<path d="' + d + 'Z" fill="none" stroke="currentColor" stroke-width="5"/>'
    + '<path d="M50 72C34 60 26 52 26 43c0-7 5.5-12 12-12 5 0 9 2.6 12 6.6C53 33.6 57 31 62 31c6.5 0 12 5 12 12 0 9-8 17-24 29Z" fill="currentColor"/>'
    + '<circle cx="41.5" cy="45" r="2.6" fill="var(--paper)"/><circle cx="58.5" cy="45" r="2.6" fill="var(--paper)"/>'
    + '<path d="M44 53q6 5 12 0" fill="none" stroke="var(--paper)" stroke-width="2.6" stroke-linecap="round"/>'
    + '</svg>';
})();

/* 화면 한가운데 크게 박는다 + 파티클이 터진다 (사장님 2026-09-08) */
function bang(a) {
  const el = document.createElement('div');
  el.className = 'u2bang';
  el.innerHTML = '<div class="u2bang-flash"></div>'
    + '<div class="u2bang-seal ' + a.cls + '">' + SEAL + '</div>'
    + '<div class="u2bang-w">' + a.word + '</div>';
  document.body.appendChild(el);

  if (a.flash) el.querySelector('.u2bang-flash').style.animation = 'u2flash .4s ease-out forwards';
  el.querySelector('.u2bang-w').style.animation = 'u2wgo .9s ease-out .12s forwards';
  el.querySelector('.u2bang-w').style.opacity = 0;

  const 색 = ['var(--pop)', 'var(--acc)', 'var(--acc2)', 'var(--ink)'];
  for (let i = 0; i < a.p; i++) {
    const s = document.createElement('span');
    const ang = Math.random() * 6.283, r = 90 + Math.random() * 230;
    s.className = 'u2p';
    s.style.background = 색[i % 색.length];
    s.style.borderRadius = i % 3 === 0 ? '50%' : '3px';
    const sz = 8 + Math.random() * 12;
    s.style.width = sz + 'px'; s.style.height = sz + 'px';
    s.style.setProperty('--dx', (Math.cos(ang) * r).toFixed(0) + 'px');
    s.style.setProperty('--dy', (Math.sin(ang) * r).toFixed(0) + 'px');
    s.style.setProperty('--rot', Math.round(-540 + Math.random() * 1080) + 'deg');
    s.style.animation = 'u2pgo ' + (0.7 + Math.random() * 0.5).toFixed(2) + 's cubic-bezier(.2,.8,.4,1) '
      + (Math.random() * 0.12).toFixed(2) + 's forwards';
    el.appendChild(s);
  }
  document.querySelector('.u2wrap').classList.add('u2shake');
  if (navigator.vibrate) navigator.vibrate([12, 30, 18]);
  setTimeout(() => document.querySelector('.u2wrap').classList.remove('u2shake'), 450);
  setTimeout(() => el.remove(), a.ms + 300);
}
